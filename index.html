<!doctype html>
<html>
  <script>
    var Immolate = {
      onRuntimeInitialized: function() {
        if (instantAnalysis) {
          performAnalysis();
        }
      }
    };

    // Helper function for vectors
    function asVector(arr) {
      var vectorInt = new Module.VectorStr();
      for (var i = 0; i < arr.length; i++) {
        vectorInt.push_back(arr[i]);
      }
      return vectorInt;
    }
  </script>
  <script src="immolate.js"></script>
  <script src="UI.js" defer></script>
  <style>
    @font-face {
      font-family: 'm6x11';
      src: url('/m6x11plus.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    
    body, h1, p {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "m6x11", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #a0c3ac;
    }

    h1 {
      text-align: center;
      font-weight: normal;
      padding: 2rem 0;
      background-color: #006025;
      color: #ffffff;
    }
    
    h2 {
      text-align: center;
      font-weight: normal;
      background-color: #006025;
      color: #ffffff;
    }

    p {
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      text-align: center;
      font-size: 1.2em;
    }

    label {
      font-size: 1.2em;
    }

    .container {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
    }

    .input-section {
      flex: 1;
      padding: 20px;
      background-color: #f5f5f5;
      border-radius: 5px;
    }

    .output-section {
      flex: 1;
      padding: 20px;
      background-color: #f5f5f5;
      border-radius: 5px;
    }

    textarea {
      width: 100%;

    }

    .genGroup {
      text-align: left;
      margin: 6px auto;
      max-width: 420px;
    }
    .genGroup summary {
      cursor: pointer;
      font-size: 1.1em;
    }
    .genGroup label {
      display: inline-block;
      min-width: 220px;
      font-size: 1em;
    }
    .genGroup input {
      width: 70px;
    }

    /* Change the font and background color */
    select {
      font-family: "m6x11", sans-serif;
      font-size: 1em;
      background-color: #f2f2f2;
      color: #333;
    }

    button {
      font-family: "m6x11", sans-serif;
      font-size: 1.5em;
      background-color: #f2f2f2;
      color: #333;
    }

    /* Remove the default arrow and add custom styling */
    select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-image: url('path/to/custom-arrow.png');
      background-repeat: no-repeat;
      background-position: right 8px center;
      padding-right: 25px; /* Adjust as needed to accommodate the custom arrow */
    }

    /* Add border and padding */
    select {
      border: 1px solid #ccc;
      padding: 6px 10px;
      border-radius: 4px;
    }
    button {
      border: 1px solid #ccc;
      padding: 6px 10px;
      border-radius: 4px;
    }

    /* Style the dropdown options */
    select option {
      background-color: #fff;
      color: #333;
      padding: 6px 10px;
    }

    /* Change the font and background color */
    input {
      font-family: "m6x11", sans-serif;
      font-size: 1em;
      background-color: #f2f2f2;
      color: #333;
    }

    /* Add border, padding, and rounded corners */
    input {
      border: 1px solid #ccc;
      padding: 6px 10px;
      border-radius: 4px;
    }

    /* Style the focused input box */
    input:focus {
      outline: none;
      border-color: #6495ed;
      box-shadow: 0 0 5px rgba(100, 149, 237, 0.5);
    }

    /* Style the number input box */
    input[type="number"] {
      width: 60px; /* Adjust as needed */
    }

    /* Style the text input box */
    input[type="text"] {
      width: 200px; /* Adjust as needed */
    }
    input[id="seed"] {
      width: 80px; /* Adjust as needed */
    }

    #checkboxesOverlay {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.4);
    }

    #checkboxesPopup {
      background-color: #fefefe;
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 75%;
    }

    .unlockSection {
      text-align: left;
      margin-bottom: 14px;
      padding: 8px 10px;
      border: 1px solid #cccccc;
      border-radius: 4px;
    }

    .unlockSectionHeader {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 1.05em;
      font-weight: bold;
    }

    .unlockSectionHeader .unlockCount {
      font-weight: normal;
      font-size: 0.85em;
      color: #555555;
    }

    .unlockSectionHeader button {
      font-size: 0.8em;
      padding: 2px 8px;
    }

    .unlockGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 2px 12px;
    }

    .unlockGrid label {
      display: block;
      font-size: 0.95em;
      white-space: nowrap;
    }

    .unlockFooter {
      margin-top: 6px;
    }

    .importStatus {
      font-size: 0.85em;
      margin: 4px auto 0;
      max-width: 520px;
      color: #333333;
      white-space: pre-line;
    }
    .importStatus.error {
      color: #b00020;
    }

    .clearfix::after {
      content: "";
      clear: both;
      display: table;
    }
  </style>

  <script>
    // Every Joker / consumable generation source the analyzer surfaces, besides the shop,
    // packs, and Sixth Sense (which has its own trigger-based display). Each `source` is the
    // append key Balatro passes to create_card, so each one is its own per-ante RNG stream.
    //   kind: joker (rarity polled or forced by source), tarot, spectral, planet
    //   param: URL query parameter for the per-ante count (kept stable for old links)
    //   input: id of the count input in the settings form
    const GENERATORS = [
      // --- Joker Generation ---
      { group: 'joker', kind: 'joker', source: 'jud', label: 'Judgement',    param: 'judgement',   input: 'judgementCount',   def: 10, hint: 'Tarot: creates a random Joker' },
      { group: 'joker', kind: 'joker', source: 'rif', label: 'Riff-Raff',    param: 'riffRaff',    input: 'riffRaffCount',    def: 6,  hint: '2 Common Jokers per blind selected' },
      { group: 'joker', kind: 'joker', source: 'sou', label: 'The Soul',     param: 'soul',        input: 'soulCount',        def: 5,  hint: 'Legendary pool is run-wide: Nth Soul used in the run, edition rolled per ante' },
      { group: 'joker', kind: 'joker', source: 'wra', label: 'Wraith',       param: 'wraith',      input: 'wraithCount',      def: 5,  hint: 'Spectral: creates a random Rare Joker' },
      { group: 'joker', kind: 'joker', source: 'rta', label: 'Rare Tag',     param: 'rareTag',     input: 'rareTagCount',     def: 3,  hint: 'Next shop has a free Rare Joker' },
      { group: 'joker', kind: 'joker', source: 'uta', label: 'Uncommon Tag', param: 'uncommonTag', input: 'uncommonTagCount', def: 3,  hint: 'Next shop has a free Uncommon Joker' },
      { group: 'joker', kind: 'joker', source: 'top', label: 'Top-up Tag',   param: 'topUpTag',    input: 'topUpTagCount',    def: 6,  hint: 'Creates up to 2 Common Jokers' },
      // --- Consumable Generation ---
      { group: 'consumable', kind: 'tarot',    source: 'car', label: 'Cartomancer',         param: 'cartomancer',   input: 'cartomancerCount',   def: 20, hint: 'Tarot when a blind is selected' },
      { group: 'consumable', kind: 'tarot',    source: '8ba', label: '8 Ball / Purple Seal', param: 'eightBall',     input: 'eightBallCount',     def: 20, hint: 'Shared stream: 1 in 4 per 8 scored, or Purple Seal discarded' },
      { group: 'consumable', kind: 'tarot',    source: 'emp', label: 'Emperor',             param: 'emperor',       input: 'emperorCount',       def: 20, hint: 'Tarot: creates 2 random Tarots' },
      { group: 'consumable', kind: 'tarot',    source: 'van', label: 'Vagabond',            param: 'vagabond',      input: 'vagabondCount',      def: 10, hint: 'Tarot when a hand is played with $4 or less' },
      { group: 'consumable', kind: 'tarot',    source: 'sup', label: 'Superposition',       param: 'superposition', input: 'superpositionCount', def: 10, hint: 'Tarot when a Straight containing an Ace is played' },
      { group: 'consumable', kind: 'tarot',    source: 'hal', label: 'Hallucination',       param: 'hallucination', input: 'hallucinationCount', def: 10, hint: '1 in 2 chance of a Tarot when a Booster Pack is opened' },
      { group: 'consumable', kind: 'spectral', source: 'sea', label: 'Seance',              param: 'seance',        input: 'seanceCount',        def: 10, hint: 'Spectral when a Straight Flush is played' },
      { group: 'consumable', kind: 'planet',   source: 'pri', label: 'High Priestess',      param: 'highPriestess', input: 'highPriestessCount', def: 10, hint: 'Tarot: creates 2 random Planets' },
    ];
    window.GENERATORS = GENERATORS;

    // Build the count inputs for the two collapsible settings groups.
    GENERATORS.forEach(g => {
      const holder = document.getElementById(g.group === 'joker' ? 'jokerGenInputs' : 'consumableGenInputs');
      const label = document.createElement('label');
      label.htmlFor = g.input;
      label.textContent = g.label + ':';
      label.title = g.hint;
      const input = document.createElement('input');
      input.type = 'number'; input.id = g.input; input.min = 0; input.max = 999; input.value = g.def; input.required = true;
      input.title = g.hint;
      holder.appendChild(label);
      holder.appendChild(input);
      holder.appendChild(document.createElement('br'));
    });

    //Unlocks stuff
    // Option values
    const options = ["Negative Tag",
                    "Foil Tag",
                    "Holographic Tag",
                    "Polychrome Tag",
                    "Rare Tag",
                    "Golden Ticket",
                    "Mr. Bones",
                    "Acrobat",
                    "Sock and Buskin",
                    "Swashbuckler",
                    "Troubadour",
                    "Certificate",
                    "Smeared Joker",
                    "Throwback",
                    "Hanging Chad",
                    "Rough Gem",
                    "Bloodstone",
                    "Arrowhead",
                    "Onyx Agate",
                    "Glass Joker",
                    "Showman",
                    "Flower Pot",
                    "Blueprint",
                    "Wee Joker",
                    "Merry Andy",
                    "Oops! All 6s",
                    "The Idol",
                    "Seeing Double",
                    "Matador",
                    "Hit the Road",
                    "The Duo",
                    "The Trio",
                    "The Family",
                    "The Order",
                    "The Tribe",
                    "Stuntman",
                    "Invisible Joker",
                    "Brainstorm",
                    "Satellite",
                    "Shoot the Moon",
                    "Drivers License",
                    "Cartomancer",
                    "Astronomer",
                    "Burnt Joker",
                    "Bootstraps",
                    "Overstock Plus",
                    "Liquidation",
                    "Glow Up",
                    "Reroll Glut",
                    "Omen Globe",
                    "Observatory",
                    "Nacho Tong",
                    "Recyclomancy",
                    "Tarot Tycoon",
                    "Planet Tycoon",
                    "Money Tree",
                    "Antimatter",
                    "Illusion",
                    "Petroglyph",
                    "Retcon",
                    "Palette"]
    selectedOptions = Array(61).fill(true);

    // Get references to elements
    const openCheckboxesBtn = document.getElementById('openCheckboxesBtn');
    const checkboxesOverlay = document.getElementById('checkboxesOverlay');
    const checkboxesPopup = document.getElementById('checkboxesPopup');
    const checkboxesContainer = document.getElementById('checkboxesContainer');
    const submitBtn = document.getElementById('submitBtn');
    const lockBtn = document.getElementById('lockBtn');
    const unlockBtn = document.getElementById('unlockBtn');

    // Unlock sections. The order of `options` is fixed because the share link encodes
    // unlocks as a bit string by index, so grouping is display-only: each checkbox carries
    // its original index and results are read back by that index.
    const UNLOCK_SECTIONS = [
      { key: 'tags',     title: 'Tags' },
      { key: 'vouchers', title: 'Vouchers' },
      { key: 'common',   title: 'Common Jokers' },
      { key: 'uncommon', title: 'Uncommon Jokers' },
      { key: 'rare',     title: 'Rare Jokers' },
    ];
    var unlockSectionOf = null;
    function classifyUnlocks() {
      if (unlockSectionOf) return unlockSectionOf;
      const has = (vec, name) => { for (let i = 0; i < vec.size(); i++) if (vec.get(i) === name) return true; return false; };
      unlockSectionOf = options.map(name => {
        if (has(Immolate.TAGS, name)) return 'tags';
        if (has(Immolate.VOUCHERS, name)) return 'vouchers';
        if (has(Immolate.RARE_JOKERS, name)) return 'rare';
        if (has(Immolate.UNCOMMON_JOKERS, name)) return 'uncommon';
        if (has(Immolate.COMMON_JOKERS, name)) return 'common';
        console.warn('Unlock option not found in any engine list:', name);
        return 'common';
      });
      return unlockSectionOf;
    }

    function createCheckboxes() {
      checkboxesContainer.innerHTML = '';
      const sectionOf = classifyUnlocks();

      UNLOCK_SECTIONS.forEach(sec => {
        const indices = options.map((_, i) => i).filter(i => sectionOf[i] === sec.key);
        if (indices.length === 0) return;

        const section = document.createElement('div');
        section.className = 'unlockSection';

        const header = document.createElement('div');
        header.className = 'unlockSectionHeader';
        const titleEl = document.createElement('span');
        titleEl.textContent = sec.title;
        const countEl = document.createElement('span');
        countEl.className = 'unlockCount';
        const allBtn = document.createElement('button');
        allBtn.type = 'button';
        allBtn.textContent = 'Unlock all';
        const noneBtn = document.createElement('button');
        noneBtn.type = 'button';
        noneBtn.textContent = 'Lock all';
        header.appendChild(titleEl);
        header.appendChild(countEl);
        header.appendChild(allBtn);
        header.appendChild(noneBtn);
        section.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'unlockGrid';
        const boxes = [];
        indices.forEach(i => {
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = options[i];
          checkbox.dataset.index = i;
          checkbox.checked = selectedOptions[i];
          const label = document.createElement('label');
          label.textContent = options[i];
          label.prepend(checkbox);
          grid.appendChild(label);
          boxes.push(checkbox);
        });
        section.appendChild(grid);

        const refreshCount = () => { countEl.textContent = boxes.filter(b => b.checked).length + ' / ' + boxes.length + ' unlocked'; };
        boxes.forEach(b => b.addEventListener('change', refreshCount));
        allBtn.addEventListener('click', () => { boxes.forEach(b => b.checked = true); refreshCount(); });
        noneBtn.addEventListener('click', () => { boxes.forEach(b => b.checked = false); refreshCount(); });
        section.refreshCount = refreshCount;
        refreshCount();

        checkboxesContainer.appendChild(section);
      });
    }

    function readCheckboxes() {
      const result = selectedOptions.slice();
      checkboxesContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        result[parseInt(cb.dataset.index, 10)] = cb.checked;
      });
      return result;
    }
    function setAllCheckboxes(on) {
      checkboxesContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => { cb.checked = on; });
      checkboxesContainer.querySelectorAll('.unlockSection').forEach(sec => sec.refreshCount && sec.refreshCount());
    }

    function handleSubmit() {
      selectedOptions = readCheckboxes();
      closeOverlay();
    }
    function handleLock() { setAllCheckboxes(false); }
    function handleUnlock() { setAllCheckboxes(true); }

    // Function to open the checkbox overlay
    function openOverlay() {
      createCheckboxes();
      checkboxesOverlay.style.display = 'block';
    }

    // Function to close the checkbox overlay
    function closeOverlay() {
      checkboxesOverlay.style.display = 'none';
    }

    // Event listeners
    openCheckboxesBtn.addEventListener('click', openOverlay);
    window.addEventListener('click', (event) => {
      if (event.target == checkboxesOverlay) {
        closeOverlay();
      }
    });
    submitBtn.addEventListener('click', handleSubmit);
    lockBtn.addEventListener('click', handleLock);
    unlockBtn.addEventListener('click', handleUnlock);


    // Default shop frames: 5 in ante 1, rising by 5 each ante
    function defaultFrames(numAntes) {
      var out = [];
      for (let i = 1; i <= numAntes; i++) out.push(5 * i);
      return out.join(',');
    }

    // Voucher purchase tracking for run-guide use: voucher name -> ante it was bought in.
    // Nothing is assumed bought; the offered voucher for each ante is rolled against
    // what you have actually marked as owned before that ante.
    var voucherPurchases = {};
    // Extra packs revealed per ante (ante -> count beyond the game's default 4/6).
    var extraPacks = {};
    window.packState = {
      extra: extraPacks,
      more: function(ante) { extraPacks[ante] = (extraPacks[ante] || 0) + 1; performAnalysis(); },
      reset: function(ante) { delete extraPacks[ante]; performAnalysis(); }
    };
    // Extra tags revealed per ante (ante -> count beyond the game's default 2).
    var extraTags = {};
    window.tagState = {
      extra: extraTags,
      more: function(ante) { extraTags[ante] = (extraTags[ante] || 0) + 1; performAnalysis(); },
      reset: function(ante) { delete extraTags[ante]; performAnalysis(); }
    };
    // Extra Sixth Sense triggers revealed per ante (ante -> extra sets of 3, for
    // replaying an ante after Hieroglyph/Petroglyph).
    var extraSixth = {};
    window.sixthState = {
      extra: extraSixth,
      more: function(ante) { extraSixth[ante] = (extraSixth[ante] || 0) + 1; performAnalysis(); },
      reset: function(ante) { delete extraSixth[ante]; performAnalysis(); }
    };
    const DECK_VOUCHERS = {
      "Magic Deck": ["Crystal Ball"],
      "Nebula Deck": ["Telescope"],
      "Zodiac Deck": ["Tarot Merchant", "Planet Merchant", "Overstock"]
    };
    function voucherPairs() {
      var pairs = [];
      for (let i = 0; i < Immolate.VOUCHERS.size(); i += 2) {
        pairs.push([Immolate.VOUCHERS.get(i), Immolate.VOUCHERS.get(i + 1)]);
      }
      return pairs;
    }
    window.voucherState = {
      purchases: voucherPurchases,
      get pairs() { return voucherPairs(); },
      get deckVouchers() { return DECK_VOUCHERS[document.getElementById('deck').value] || []; },
      buy: function(name, ante) {
        voucherPurchases[name] = ante;
        performAnalysis();
      },
      unbuy: function(name) {
        delete voucherPurchases[name];
        // Dropping a tier-1 voucher also drops its tier-2 upgrade.
        voucherPairs().forEach(([t1, t2]) => { if (t1 == name) delete voucherPurchases[t2]; });
        performAnalysis();
      }
    };

    // ---- Deck tracking + draw order ----
    // Balatro shuffles the whole deck at run start and at the start of every blind
    // (CardArea:shuffle('nr'..ante)), so each round's draw order is a fixed permutation of
    // whatever the deck holds at that moment. Plays and discards never change what comes
    // next; only adding or removing cards does. Deck changes are recorded as ops that take
    // effect from a given (ante, round) and are kept in localStorage per seed + deck. They
    // are deliberately not part of the share link.
    // Calibrated against seed 11111111, Red Deck, 1.0.1n: the first pull of 'nr1' is the
    // round 1 draw order and the second pull is round 2, dealt from the end of the list.
    // The run-start shuffle therefore does not consume a pull from this stream.
    const DRAW_RUN_START_SHUFFLE = false;
    const DRAW_FROM_END = true;
    // Perkeo firing more than once in one shop (Blueprint / Brainstorm): each trigger queues
    // its own event calling pseudoseed('perkeo'), so each copy takes a fresh pull from the
    // run-wide stream against the pool grown by the earlier copies. Confirmed by a save at
    // ante 21 whose 'perkeo' stream had advanced 274 times: far more than one per shop.
    // (Both models fit the earlier hand observations; the save count separates them.)
    const PERKEO_PULL_PER_TRIGGER = true;
    var deckOps = [];        // { type:'add', id, name, ante, round, seq } | { type:'remove', target, ante, round, seq }
    var deckRounds = {};     // ante -> [{ hand, cards: [{ id, name }] }], rebuilt by performAnalysis
    var extraRounds = {};    // ante -> extra rounds revealed (replaying an ante after Hieroglyph/Petroglyph)
    var deckHandAdjust = 0;  // manual hand-size tweak (Juggler, Stuntman, Turtle Bean, ...)
    var deckSeq = 0;
    var deckStoreKey = null;

    function cardCodeToName(code) {
      const ranks = { T: "10", J: "Jack", Q: "Queen", K: "King", A: "Ace" };
      const suits = { C: "Clubs", D: "Diamonds", H: "Hearts", S: "Spades" };
      return (ranks[code[2]] || code[2]) + " of " + suits[code[0]];
    }

    // Starting deck in sort_id order. start_run builds one proto per entry of G.P_CARDS
    // (dropping faces for Abandoned, remapping C->S and D->H for Checkered, or 52 seeded
    // picks for Erratic), then table.sort()s them by suit..rank string before creating the
    // cards, so creation order is plain string order of the "S_R" codes.
    function startingDeck(inst, deck) {
      var protos = [];
      if (deck == "Erratic Deck") {
        for (let i = 0; i < 52; i++) protos.push(Immolate.CARDS.get(inst.randint("erratic", 0, 51)));
      } else {
        for (let i = 0; i < Immolate.CARDS.size(); i++) {
          var c = Immolate.CARDS.get(i);
          if (deck == "Abandoned Deck" && "JQK".includes(c[2])) continue;
          if (deck == "Checkered Deck") c = (c[0] == "C" ? "S" : c[0] == "D" ? "H" : c[0]) + c.slice(1);
          protos.push(c);
        }
      }
      protos.sort();
      return protos;
    }

    // Deck contents when round r of ante a is shuffled: starting cards plus added cards
    // (in acquisition order, which is what sort_id follows), minus removed ones.
    function deckAt(startCards, a, r) {
      const eff = (op) => op.ante < a || (op.ante == a && op.round <= r);
      var cards = startCards.map((code, i) => ({ id: 's' + i, name: cardCodeToName(code) }));
      deckOps.filter(op => op.type == 'add' && eff(op))
        .sort((x, y) => (x.ante - y.ante) || (x.round - y.round) || (x.seq - y.seq))
        .forEach(op => cards.push({ id: op.id, name: op.name }));
      var removed = new Set(deckOps.filter(op => op.type == 'remove' && eff(op)).map(op => op.target));
      return cards.filter(c => !removed.has(c.id));
    }

    function saveDeckState() {
      try {
        localStorage.setItem(deckStoreKey, JSON.stringify({ ops: deckOps, handAdjust: deckHandAdjust, extraRounds: extraRounds, seq: deckSeq }));
      } catch (e) { /* storage unavailable: state lives for this page only */ }
    }
    function loadDeckState(seed, deck) {
      var key = 'theSoulDeck:' + seed + ':' + deck;
      if (key == deckStoreKey) return;
      deckStoreKey = key;
      deckOps.length = 0; deckHandAdjust = 0; deckSeq = 0;
      Object.keys(extraRounds).forEach(k => delete extraRounds[k]);
      try {
        var st = JSON.parse(localStorage.getItem(key));
        if (st) {
          (st.ops || []).forEach(o => deckOps.push(o));
          deckHandAdjust = st.handAdjust || 0;
          Object.assign(extraRounds, st.extraRounds || {});
          deckSeq = st.seq || 0;
        }
      } catch (e) { /* corrupt or missing entry: start clean */ }
    }
    function deckChanged() { saveDeckState(); performAnalysis(); }

    window.deckState = {
      rounds: deckRounds,
      ops: deckOps,
      extra: extraRounds,
      get handAdjust() { return deckHandAdjust; },
      setHandAdjust: function(n) { deckHandAdjust = Math.max(-7, Math.min(20, parseInt(n, 10) || 0)); deckChanged(); },
      // Card joins the deck from round `round` of ante `ante` (e.g. bought after the Small Blind -> round 2).
      add: function(name, ante, round) {
        deckSeq++;
        deckOps.push({ type: 'add', id: 'c' + deckSeq, name: name, ante: ante, round: round, seq: deckSeq });
        deckChanged();
      },
      // Card leaves the deck from round `round` of ante `ante` (destroyed during the round before).
      remove: function(id, name, ante, round) {
        deckSeq++;
        deckOps.push({ type: 'remove', target: id, name: name, ante: ante, round: round, seq: deckSeq });
        deckChanged();
      },
      undo: function(seq) {
        var idx = deckOps.findIndex(op => op.seq == seq);
        if (idx < 0) return;
        var op = deckOps[idx];
        deckOps.splice(idx, 1);
        // Dropping an added card also drops any removal recorded against it.
        if (op.type == 'add') for (let i = deckOps.length - 1; i >= 0; i--) if (deckOps[i].type == 'remove' && deckOps[i].target == op.id) deckOps.splice(i, 1);
        deckChanged();
      },
      clear: function() { deckOps.length = 0; deckHandAdjust = 0; Object.keys(extraRounds).forEach(k => delete extraRounds[k]); deckChanged(); },
      moreRounds: function(ante) { extraRounds[ante] = (extraRounds[ante] || 0) + 1; deckChanged(); },
      resetRounds: function(ante) { delete extraRounds[ante]; deckChanged(); }
    };

    // ---- Save import (Balatro save.jkr) ----
    // A save is a raw DEFLATE stream around a Lua table literal. Importing one fills the
    // run settings, replaces the owned cards and tracked deck with the save's contents, and
    // stores every RNG stream value from GAME.pseudorandom. Analysis then starts at the
    // saved ante with those streams restored, so the first rolls it shows are the ones the
    // game will make next. Antes before the save are not shown: their streams are spent.
    var saveResume = null; // see importSave() for the fields
    var saveResumeKey = null;
    function resumeStoreKey(seed, deck) { return 'theSoulResume:' + seed + ':' + deck; }
    function saveResumeState() { try { if (saveResume) localStorage.setItem(saveResumeKey, JSON.stringify(saveResume)); else if (saveResumeKey) localStorage.removeItem(saveResumeKey); } catch (e) { /* page-only */ } }
    function loadResumeState(seed, deck) {
      var key = resumeStoreKey(seed, deck);
      if (key == saveResumeKey) return;
      saveResumeKey = key; saveResume = null;
      try { var st = JSON.parse(localStorage.getItem(key)); if (st && st.nodes) saveResume = st; } catch (e) { /* start clean */ }
    }
    window.saveResume = {
      get active() { return saveResume; },
      forget: function() { saveResume = null; saveResumeState(); performAnalysis(); }
    };

    async function inflateRaw(buf) {
      const ds = new DecompressionStream('deflate-raw');
      const stream = new Blob([buf]).stream().pipeThrough(ds);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    // Minimal parser for the Lua table literal Balatro writes (strings, numbers, booleans,
    // nested tables with [key]= or bare-word keys).
    function parseLuaTable(t) {
      let i = 0;
      const ws = () => { while (i < t.length && ' \t\r\n'.includes(t[i])) i++; };
      const val = () => {
        ws();
        const c = t[i];
        if (c === '{') return table();
        if (c === '"') {
          i++; let out = '';
          while (t[i] !== '"') {
            if (t[i] === '\\') { i++; const e = t[i]; out += ({ n: '\n', t: '\t', '"': '"', '\\': '\\', '/': '/' })[e] || e; i++; }
            else out += t[i++];
          }
          i++; return out;
        }
        const m = /^-?\d+(\.\d+)?([eE][-+]?\d+)?/.exec(t.slice(i, i + 40));
        if (m) { i += m[0].length; return Number(m[0]); }
        for (const [lit, v] of [['true', true], ['false', false], ['nil', null]]) if (t.startsWith(lit, i)) { i += lit.length; return v; }
        throw new Error('Unexpected token at ' + i + ': ' + t.slice(i, i + 30));
      };
      const table = () => {
        i++; const d = {};
        for (;;) {
          ws();
          if (t[i] === '}') { i++; return d; }
          let k;
          if (t[i] === '[') { i++; k = val(); ws(); if (t[i] !== ']') throw new Error('Expected ] at ' + i); i++; }
          else { const m = /^[A-Za-z_]\w*/.exec(t.slice(i, i + 80)); k = m[0]; i += k.length; }
          ws(); if (t[i] !== '=') throw new Error('Expected = at ' + i); i++;
          d[k] = val(); ws();
          if (t[i] === ',') i++;
        }
      };
      ws(); if (t.startsWith('return', i)) i += 6;
      return val();
    }

    const SAVE_DECKS = { b_red: 'Red Deck', b_blue: 'Blue Deck', b_yellow: 'Yellow Deck', b_green: 'Green Deck', b_black: 'Black Deck', b_magic: 'Magic Deck', b_nebula: 'Nebula Deck', b_ghost: 'Ghost Deck', b_abandoned: 'Abandoned Deck', b_checkered: 'Checkered Deck', b_zodiac: 'Zodiac Deck', b_painted: 'Painted Deck', b_anaglyph: 'Anaglyph Deck', b_plasma: 'Plasma Deck', b_erratic: 'Erratic Deck' };
    const SAVE_STAKES = ['White Stake', 'Red Stake', 'Green Stake', 'Black Stake', 'Blue Stake', 'Purple Stake', 'Orange Stake', 'Gold Stake'];
    // Save names that differ from the engine's spelling
    const SAVE_NAME_FIX = { 'Mail-In Rebate': 'Mail In Rebate', "Driver's License": 'Drivers License', 'Riff-Raff': 'Riff-raff' };
    const SAVE_ENHANCEMENTS = { m_bonus: 'Bonus', m_mult: 'Mult', m_wild: 'Wild', m_glass: 'Glass', m_steel: 'Steel', m_stone: 'Stone', m_gold: 'Gold', m_lucky: 'Lucky' };
    const SAVE_EDITIONS = { foil: 'Foil', holo: 'Holographic', polychrome: 'Polychrome', negative: 'Negative' };

    // Save keys -> engine names for bosses, tags, and vouchers. Built from the engine lists:
    // "The Wall" -> bl_wall, "Amber Acorn" -> bl_final_acorn, "Charm Tag" -> tag_charm, etc.
    const SAVE_BOSS_KEYS = { bl_final_acorn: 'Amber Acorn', bl_final_bell: 'Cerulean Bell', bl_final_heart: 'Crimson Heart', bl_final_leaf: 'Verdant Leaf', bl_final_vessel: 'Violet Vessel' };
    const SAVE_TAG_KEYS = { tag_top_up: 'Top-up Tag', tag_d_six: 'D6 Tag' };
    const SAVE_VOUCHER_KEYS = { v_overstock_norm: 'Overstock', v_overstock_plus: 'Overstock Plus', v_directors_cut: "Director's Cut" };
    function saveNameTables() {
      const boss = Object.assign({}, SAVE_BOSS_KEYS), tag = Object.assign({}, SAVE_TAG_KEYS), voucher = Object.assign({}, SAVE_VOUCHER_KEYS);
      const slug = n => n.toLowerCase().replace(/'/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
      for (let i = 0; i < Immolate.BOSSES.size(); i++) { const n = Immolate.BOSSES.get(i); if (n.startsWith('The ')) boss['bl_' + slug(n.slice(4))] = n; }
      for (let i = 0; i < Immolate.TAGS.size(); i++) { const n = Immolate.TAGS.get(i); const k = 'tag_' + slug(n.replace(/ Tag$/, '')); if (!Object.values(tag).includes(n)) tag[k] = n; }
      for (let i = 0; i < Immolate.VOUCHERS.size(); i++) { const n = Immolate.VOUCHERS.get(i); const k = 'v_' + slug(n); if (!Object.values(voucher).includes(n)) voucher[k] = n; }
      return { boss, tag, voucher };
    }

    function cardsOf(save, area) {
      const c = (save.cardAreas[area] || {}).cards || {};
      return Object.keys(c).map(k => c[k]).sort((x, y) => (x.rank || 0) - (y.rank || 0));
    }

    async function importSave(file) {
      const status = document.getElementById('importSaveStatus');
      status.classList.remove('error');
      status.textContent = 'Reading ' + file.name + '...';
      try {
        const bytes = await inflateRaw(await file.arrayBuffer());
        const save = parseLuaTable(new TextDecoder().decode(bytes));
        const G = save.GAME;
        const pr = G.pseudorandom || {};
        const seed = pr.seed;
        if (!seed) throw new Error('No seed in save (GAME.pseudorandom.seed)');
        const ante = G.round_resets.ante;
        const deckName = SAVE_DECKS[(save.BACK && save.BACK.key) || (G.selected_back_key && G.selected_back_key.key)] || 'Red Deck';
        const stakeName = SAVE_STAKES[(G.stake || 1) - 1] || 'White Stake';
        const version = String(save.VERSION || '');
        const versionSel = document.getElementById('version');
        const versionVal = version.startsWith('1.0.1') && version >= '1.0.1f' ? '10106' : version.startsWith('1.0.1') ? '10103' : '10014';
        // Run position within the ante: how many blinds are defeated decides which shop
        // comes next. States: Small/Big/Boss each Upcoming | Current | Defeated | Skipped.
        const bs = G.round_resets.blind_states || {};
        const done = ['Small', 'Big', 'Boss'].filter(b => bs[b] === 'Defeated' || bs[b] === 'Skipped').length;
        const inShop = save.STATE === 5;  // G.STATES.SHOP

        // Settings
        document.getElementById('seed').value = seed;
        document.getElementById('deck').value = deckName;
        document.getElementById('stake').value = stakeName;
        versionSel.value = versionVal;
        document.getElementById('ante').value = Math.max(parseInt(document.getElementById('ante').value, 10) || 0, ante + 4);

        // Owned Jokers / consumables: replace with the save's, all held from this ante,
        // in slot order (rank), so Perkeo pools and rerolls match the game.
        loadOwnedState(seed, deckName);
        ownedItems.length = 0; ownedSeq = 0;
        const addOwned = (c, extra) => { ownedSeq++; const name = SAVE_NAME_FIX[c.ability.name] || c.ability.name; ownedItems.push(Object.assign({ id: 'o' + ownedSeq, name: name, from: ante, to: null, pos: 1 }, extra || {})); return name; };
        const jokers = cardsOf(save, 'jokers').map(c => addOwned(c, c.edition && c.edition.type === 'negative' ? { negative: true } : null));
        const consumables = cardsOf(save, 'consumeables').map(c => addOwned(c, c.edition && c.edition.type === 'negative' ? { negative: true } : null));
        ownedShowman = jokers.includes('Showman');
        saveOwnedState();

        // Vouchers: mark everything in used_vouchers as bought before this ante
        Object.keys(voucherPurchases).forEach(k => delete voucherPurchases[k]);
        const names = saveNameTables();
        const vouchersFound = [], vouchersUnknown = [];
        Object.keys(G.used_vouchers || {}).forEach(k => { if (names.voucher[k]) { voucherPurchases[names.voucher[k]] = Math.max(1, ante - 1); vouchersFound.push(names.voucher[k]); } else vouchersUnknown.push(k); });

        // Deck: replace the tracked deck with the save's cards in sort_id order. The starting
        // 52 are dropped (deckOps 'remove' on every s#) and the save's cards added from the
        // current round, so every listed round shuffles exactly this deck.
        loadDeckState(seed, deckName);
        deckOps.length = 0; deckSeq = 0; deckHandAdjust = 0;
        Object.keys(extraRounds).forEach(k => delete extraRounds[k]);
        const inst0 = new Immolate.Instance(seed);
        const startCount = startingDeck(inst0, deckName).length; inst0.delete();
        const roundNow = inShop ? done + 1 : Math.max(1, done + 1);
        for (let i = 0; i < startCount; i++) { deckSeq++; deckOps.push({ type: 'remove', target: 's' + i, name: 'starting card', ante: ante, round: roundNow, seq: deckSeq, save: true }); }
        const playing = ['deck', 'hand', 'discard', 'play'].flatMap(a => cardsOf(save, a)).sort((x, y) => (x.sort_id || 0) - (y.sort_id || 0));
        playing.forEach(c => {
          const enh = SAVE_ENHANCEMENTS[(c.save_fields || {}).center] ; const ed = c.edition && SAVE_EDITIONS[c.edition.type]; const seal = c.seal ? c.seal + ' Seal' : '';
          const name = (seal ? seal + ' ' : '') + (ed ? ed + ' ' : '') + (enh ? enh + ' ' : '') + c.base.value + ' of ' + c.base.suit;
          deckSeq++; deckOps.push({ type: 'add', id: 'c' + deckSeq, name: name, ante: ante, round: roundNow, seq: deckSeq, save: true });
        });
        const handSizeSaved = (save.cardAreas.hand && save.cardAreas.hand.config && save.cardAreas.hand.config.card_limit) || 8;
        const handBase = 8 + (deckName === 'Painted Deck' ? 2 : 0) + (vouchersFound.includes('Paint Brush') ? 1 : 0) + (vouchersFound.includes('Palette') ? 1 : 0);
        deckHandAdjust = handSizeSaved - handBase;
        saveDeckState();

        // RNG streams: every numeric entry in GAME.pseudorandom is a stream's current state
        const nodes = {}; let n = 0;
        Object.keys(pr).forEach(k => { if (typeof pr[k] === 'number' && k !== 'hashed_seed') { nodes[k] = pr[k]; n++; } });
        // The saved ante's boss, voucher and tags were rolled when the ante began; read them
        // from the save rather than re-rolling (their streams already sit past that roll).
        const bossKey = (G.round_resets.blind_choices || {}).Boss;
        const boss = names.boss[bossKey] || bossKey || '';
        const bt = G.round_resets.blind_tags || {};
        const tags = ['Small', 'Big'].map(b => names.tag[bt[b]] || bt[b] || '');
        const shopVoucher = cardsOf(save, 'shop_vouchers').map(c => c.ability.name)[0] || '';
        // The shop you are standing in (STATE 5): its cards and packs are already rolled and
        // on screen, so they are shown as the first frame from the save rather than rerolled.
        const fixName = n => SAVE_NAME_FIX[n] || n;
        const cardLabel = c => {
          const ab = c.ability || {}; const ed = c.edition && SAVE_EDITIONS[c.edition.type];
          return (ab.eternal ? 'Eternal ' : '') + (ab.perishable ? 'Perishable ' : '') + (ab.rental ? 'Rental ' : '') + (ed ? ed + ' ' : '') + fixName(ab.name);
        };
        const currentShop = inShop ? { cards: cardsOf(save, 'shop_jokers').map(cardLabel), packs: cardsOf(save, 'shop_booster').map(c => fixName(c.ability.name)) } : null;
        // Which shop of this ante comes next: after `done` defeated/skipped blinds. From ante 2
        // the shop after the previous Boss is shop 1, so the next shop is done+1 (ante 1: done).
        // Shops of this ante already rolled: ante 1 has none before the Small Blind; from ante
        // 2 the shop after the previous Boss is shop 1. Whether we are standing in a shop or
        // have left it, that shop's cards and packs are rolled. Perkeo fires when a shop ends,
        // so a shop we are standing in still has its Perkeo pull ahead.
        const shopsRolled = (ante === 1 ? done : done + 1);          // shops whose cards/packs are already rolled
        const perkeoFirstShop = inShop ? shopsRolled : shopsRolled + 1; // Perkeo fires when a shop ends
        const remainingBlinds = ['Small', 'Big', 'Boss'].map((b, i) => ({ b, r: i + 1 })).filter(x => bs[x.b] !== 'Defeated' && bs[x.b] !== 'Skipped');
        // Boss pool: eligible bosses with more uses than the least-used eligible one are out.
        const used = G.bosses_used || {};
        const lockedBosses = [];
        [true, false].forEach(showdown => {
          const elig = Object.keys(used).filter(k => (k.startsWith('bl_final_') === showdown) && names.boss[k]);
          if (elig.length === 0) return;
          const min = Math.min(...elig.map(k => used[k]));
          elig.forEach(k => { if (used[k] > min) lockedBosses.push(names.boss[k]); });
        });
        saveResumeKey = resumeStoreKey(seed, deckName);
        saveResume = { ante: ante, seed: seed, nodes: nodes, boss: boss, voucher: shopVoucher, voucherTaken: shopVoucher === '' && inShop, tags: tags, roundsDone: done, inShop: inShop,
          remainingRounds: remainingBlinds.map(x => x.r), remainingBlindNames: remainingBlinds.map(x => x.b),
          shopsRolled: shopsRolled, perkeoFirstShop: perkeoFirstShop, lockedBosses: lockedBosses, currentShop: currentShop,
          label: file.name + ': seed ' + seed + ', ' + deckName + ', ' + stakeName + ', ante ' + ante + (inShop ? ', in the shop after the ' + (['Small', 'Big', 'Boss'][done - 1] || 'previous Boss') + ' Blind' : ', ' + (['Small', 'Big', 'Boss'][done] || 'next ante') + ' Blind next') };

        saveResumeState();
        status.textContent = 'Imported ' + saveResume.label + '.\n'
          + jokers.length + ' Jokers, ' + consumables.length + ' consumables, ' + playing.length + ' deck cards, ' + vouchersFound.length + ' vouchers, ' + n + ' RNG streams.'
          + (ownedShowman ? ' Showman held.' : '') + (vouchersUnknown.length ? ' Unknown vouchers: ' + vouchersUnknown.join(', ') : '')
          + '\nAnalysis starts at ante ' + ante + ' with the save\'s RNG state; earlier antes are not shown.';
        performAnalysis();
      } catch (e) {
        console.error(e);
        status.classList.add('error');
        status.textContent = 'Could not import: ' + e.message;
      }
    }
    document.getElementById('importSaveBtn').addEventListener('click', () => document.getElementById('importSaveFile').click());
    document.getElementById('importSaveFile').addEventListener('change', (e) => { if (e.target.files[0]) importSave(e.target.files[0]); e.target.value = ''; });

    // ---- Owned Jokers / consumables ----
    // Balatro locks a Joker or consumable you hold out of every pool (G.GAME.used_jokers):
    // if a stream would produce it, the game retries that one draw on <key>_resample2,
    // _resample3, ... until it finds something you don't hold. randchoice() in the engine
    // does exactly this for anything hold()en, so ownership is modelled by holding each
    // owned card at the ante you get it and releasing it at the ante you lose it. Showman
    // (params.showman) waives only these "held" exclusions; permanent locks (profile
    // unlocks, ante gating, bought vouchers) still apply with Showman, as in the game.
    // Kept in localStorage per seed + deck, never in the share link.
    var ownedItems = [];     // { id, name, from, to } : held from ante `from` up to and including ante `to` (null = still held)
    // Owned entries may carry `shop` (1-based, the shop of `from` they arrived in) and
    // `perkeo: true` for Negative copies Perkeo made. Slot order is acquisition order, and
    // an entry with a shop sorts after everything acquired earlier in that ante.
    var ownedShowman = false;
    var ownedSeq = 0;
    var ownedStoreKey = null;

    function saveOwnedState() {
      try { localStorage.setItem(ownedStoreKey, JSON.stringify({ items: ownedItems, showman: ownedShowman, seq: ownedSeq })); } catch (e) { /* page-only */ }
    }
    function loadOwnedState(seed, deck) {
      var key = 'theSoulOwned:' + seed + ':' + deck;
      if (key == ownedStoreKey) return;
      ownedStoreKey = key;
      ownedItems.length = 0; ownedShowman = false; ownedSeq = 0;
      try {
        var st = JSON.parse(localStorage.getItem(key));
        if (st) { (st.items || []).forEach(o => ownedItems.push(o)); ownedShowman = !!st.showman; ownedSeq = st.seq || 0; }
      } catch (e) { /* start clean */ }
    }
    function ownedChanged() { saveOwnedState(); performAnalysis(); }
    function heldAt(item, a) { return item.from <= a && (item.to === null || item.to === undefined || a <= item.to); }
    // Shops in an ante: ante 1 has two (after the Small and Big Blinds); from ante 2 on the
    // shop after the previous Boss counts as shop 1, so there are three.
    function shopsInAnte(a) { return a == 1 ? 2 : 3; }
    // A card gained during round r is in hand for the next shop: shop r in ante 1, shop r+1
    // from ante 2 on. Beyond the ante's last shop it only counts from the next ante.
    function posForRound(a, r) { return a == 1 ? r : r + 1; }
    var consumableNameSet = null;
    function isConsumableName(name) {
      if (!consumableNameSet) {
        consumableNameSet = new Set();
        [Immolate.TAROTS, Immolate.PLANETS, Immolate.SPECTRALS].forEach(v => { for (let i = 0; i < v.size(); i++) consumableNameSet.add(v.get(i)); });
        consumableNameSet.add("The Soul"); consumableNameSet.add("Black Hole");
        consumableNameSet.delete("RETRY");
      }
      return consumableNameSet.has(name);
    }

    window.ownedState = {
      items: ownedItems,
      get showman() { return ownedShowman; },
      setShowman: function(on) { ownedShowman = !!on; ownedChanged(); },
      heldAt: heldAt,
      // Card acquired in ante `ante` (in the game it leaves the pools the moment you hold it,
      // so every queue from that ante on rerolls around it).
      // `pos` is where in the ante the card arrived, as the first shop of that ante whose
      // Perkeo pool includes it (1 = in hand by shop 1, ..., 4 = only from the next ante).
      // Rounds map to positions with posForRound(); shop purchases are their shop number.
      add: function(name, ante, pos) {
        ownedSeq++;
        ownedItems.push({ id: 'o' + ownedSeq, name: name, from: ante, to: null, pos: pos || 1 });
        ownedChanged();
      },
      setPos: function(id, pos) {
        var it = ownedItems.find(o => o.id == id);
        if (it) { it.pos = pos; ownedChanged(); }
      },
      shopsInAnte: shopsInAnte,
      posForRound: posForRound,
      // Card sold / used / destroyed during ante `ante`: still held for that ante, back in
      // the pools from the next ante on.
      release: function(id, ante) {
        var it = ownedItems.find(o => o.id == id);
        if (it) { it.to = ante; ownedChanged(); }
      },
      unrelease: function(id) {
        var it = ownedItems.find(o => o.id == id);
        if (it) { it.to = null; ownedChanged(); }
      },
      remove: function(id) {
        var idx = ownedItems.findIndex(o => o.id == id);
        if (idx >= 0) { ownedItems.splice(idx, 1); ownedChanged(); }
      },
      clear: function() { ownedItems.length = 0; ownedShowman = false; ownedChanged(); },
      // Perkeo fired again in shop `shop` (1-based) of ante `ante` (Blueprint / Brainstorm).
      // The copy it made is added to your owned cards as a Negative held from that shop on,
      // so it is in the pool for the next pick and rerolls the queues like any held card.
      // The card itself is whatever the analysis says the next pick is, so callers pass it.
      // A copy flagged kept:true is the shop's final copy, held without another trigger.
      perkeoAgain: function(name, ante, shop) {
        var kept = ownedItems.find(o => o.perkeo && o.kept && o.from == ante && o.shop == shop);
        if (kept) { kept.kept = false; }   // the kept final copy is now followed by another trigger
        else {
          ownedSeq++;
          ownedItems.push({ id: 'o' + ownedSeq, name: name, from: ante, to: null, shop: shop, perkeo: true, negative: true, kept: false });
        }
        ownedChanged();
      },
      // Undo the latest extra trigger in that shop (a kept final copy stays kept).
      perkeoFewer: function(ante, shop) {
        for (let i = ownedItems.length - 1; i >= 0; i--) {
          if (ownedItems[i].perkeo && !ownedItems[i].kept && ownedItems[i].from == ante && ownedItems[i].shop == shop) { ownedItems.splice(i, 1); break; }
        }
        ownedChanged();
      },
      // Hold the shop's final copy without Perkeo firing again.
      perkeoKeep: function(name, ante, shop) {
        ownedSeq++;
        ownedItems.push({ id: 'o' + ownedSeq, name: name, from: ante, to: null, shop: shop, perkeo: true, negative: true, kept: true });
        ownedChanged();
      },
      perkeoUnkeep: function(ante, shop) {
        var i = ownedItems.findIndex(o => o.perkeo && o.kept && o.from == ante && o.shop == shop);
        if (i >= 0) { ownedItems.splice(i, 1); ownedChanged(); }
      }
    };

    instantAnalysis = false;

    const anteInput = document.getElementById('ante');
    const framesPerAnteInput = document.getElementById('framesPerAnte');
    GENERATORS.forEach(g => { g.el = document.getElementById(g.input); });
    const deckSelect = document.getElementById('deck');
    const stakeSelect = document.getElementById('stake');
    const versionSelect = document.getElementById('version');
    const seedInput = document.getElementById('seed');
    const analyzeButton = document.getElementById('analyzeButton');
    const copyLinkButton = document.getElementById('copyButton');
    const downloadButton = document.getElementById('downloadButton');
    const outputBox = document.getElementById('outputBox');
    
    // Add event listener for the "Copy Link" button
    copyLinkButton.addEventListener('click', copyLink);

    function copyLink() {
      const baseUrl = window.location.origin + window.location.pathname;
      const params = new URLSearchParams();

      // Hash the unlocks
      // Convert the array of booleans to a binary string
      const binaryString = selectedOptions.map(unlock => unlock ? '1' : '0').join('');

      // Convert the binary string to a byte array
      const byteArray = [];
      for (let i = 0; i < binaryString.length; i += 8) {
        const byte = parseInt(binaryString.substr(i, 8), 2);
        byteArray.push(byte);
      }

      // Pad the byte array with a null byte if necessary
      if (binaryString.length % 8 !== 0) {
        const paddingBits = '0'.repeat(8 - (binaryString.length % 8));
        const paddingByte = parseInt(`${binaryString.slice(-binaryString.length % 8)}${paddingBits}`, 2);
        byteArray.push(paddingByte);
      }

      // Encode the byte array to base64
      const base64Unlocks = btoa(String.fromCharCode.apply(null, byteArray));

      // Add non-default input values as URL parameters
      if (anteInput.value !== '38') params.append('ante', anteInput.value);
      if (framesPerAnteInput.value !== defaultFrames(38)) params.append('framesPerAnte', framesPerAnteInput.value);
      GENERATORS.forEach(g => { if (g.el.value !== String(g.def)) params.append(g.param, g.el.value); });
      if (deckSelect.value !== 'Red Deck') params.append('deck', deckSelect.value);
      if (stakeSelect.value !== 'White Stake') params.append('stake', stakeSelect.value);
      if (versionSelect.value != '10106') params.append('version', versionSelect.value);
      if (seedInput.value !== '') params.append('seed', seedInput.value);
      const purchaseList = Object.keys(voucherPurchases).map(n => n + ':' + voucherPurchases[n]).join(',');
      if (purchaseList !== '') params.append('vouchers', purchaseList);
      const extraPackList = Object.keys(extraPacks).filter(a => extraPacks[a] > 0).map(a => a + ':' + extraPacks[a]).join(',');
      if (extraPackList !== '') params.append('extraPacks', extraPackList);
      const extraTagList = Object.keys(extraTags).filter(a => extraTags[a] > 0).map(a => a + ':' + extraTags[a]).join(',');
      if (extraTagList !== '') params.append('extraTags', extraTagList);
      const extraSixthList = Object.keys(extraSixth).filter(a => extraSixth[a] > 0).map(a => a + ':' + extraSixth[a]).join(',');
      if (extraSixthList !== '') params.append('extraSixth', extraSixthList);
      if (base64Unlocks != '/////////x/4') params.append('unlocks', base64Unlocks);

      const url = `${baseUrl}?${params.toString()}`;

      // Copy the URL to the clipboard
      navigator.clipboard.writeText(url)
        .then(() => {
          alert('Link copied to clipboard!');
        })
        .catch((err) => {
          console.error('Failed to copy link: ', err);
        });
    }

    downloadButton.addEventListener('click', () => {
      const filename = seedInput.value + "_analysis.txt";
      const content = outputBox.value;

      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();

      URL.revokeObjectURL(url);
    });

    // Add event listener to the "Analysis" button
    analyzeButton.addEventListener('click', performAnalysis);

    function performAnalysis() {
      // Get input values
      const ante = parseInt(anteInput.value, 10);
      const framesPerAnte = framesPerAnteInput.value.split(',').map(Number);
      const clampCount = (v) => Math.max(0, Math.min(999, parseInt(v, 10) || 0));
      GENERATORS.forEach(g => { g.count = clampCount(g.el.value); });
      const deck = deckSelect.value;
      const stake = stakeSelect.value;
      const version = parseInt(versionSelect.value);
      const seed = seedInput.value.toUpperCase().replace(/0/g, 'O');

      output = "";

      // It's analysis time!
      var inst = new Immolate.Instance(seed);
      // Every embind object handed back to JS owns a wasm heap allocation and must be
      // .delete()d, including nested ones returned by property reads (jokerData,
      // stickers). Leaking them exhausts the fixed-size wasm heap after ~10 analyses.
      var instParams = new Immolate.InstParams(deck, stake, false, version);
      inst.params = instParams;
      instParams.delete();
      inst.initLocks(1, false, false);
      inst.lock("Overstock Plus");
      inst.lock("Liquidation");
      inst.lock("Glow Up");
      inst.lock("Reroll Glut");
      inst.lock("Omen Globe");
      inst.lock("Observatory");
      inst.lock("Nacho Tong");
      inst.lock("Recyclomancy");
      inst.lock("Tarot Tycoon");
      inst.lock("Planet Tycoon");
      inst.lock("Money Tree");
      inst.lock("Antimatter");
      inst.lock("Illusion");
      inst.lock("Petroglyph");
      inst.lock("Retcon");
      inst.lock("Palette");
      for (let i = 0; i < options.length; i++) {
        if (selectedOptions[i] == false) inst.lock(options[i]);
      }
      inst.setStake(stake);
      inst.setDeck(deck);
      var ghostDeck = (deck == "Ghost Deck");
      loadDeckState(seed, deck);
      loadOwnedState(seed, deck);
      loadResumeState(seed, deck);
      // Resume from an imported save: restore every stream, then run only from the saved
      // ante. The boss pool is restored too: the game picks among eligible bosses with the
      // fewest uses, which the engine models by locking the over-used ones.
      var resume = (saveResume && saveResume.nodes && seed === saveResume.seed) ? saveResume : null;
      var firstAnte = 1;
      if (resume) {
        Object.keys(resume.nodes).forEach(k => inst.setNode(k, resume.nodes[k]));
        (resume.lockedBosses || []).forEach(b => inst.lock(b));
        firstAnte = resume.ante;
      }
      var resumingAnte = (a) => resume && a == resume.ante;
      if (ownedShowman) { var sp = inst.params; sp.showman = true; inst.params = sp; sp.delete(); }
      var startCards = startingDeck(inst, deck);
      Object.keys(deckRounds).forEach(k => delete deckRounds[k]);
      var pairs = voucherPairs();
      (DECK_VOUCHERS[deck] || []).forEach(dv => {
        for (const [t1, t2] of pairs) {
          if (t1 == dv && !selectedOptions[options.indexOf(t2)]) inst.lock(t2);
        }
      });
      for (let a = 1; a <= ante; a++) {
        inst.initUnlocks(a, false);
        if (a < firstAnte) {
          // Antes before the save: apply their permanent state (vouchers, unlocks) but roll
          // nothing; the save already holds every stream's position.
          for (const name in voucherPurchases) {
            if (voucherPurchases[name] != a - 1) continue;
            inst.activateVoucher(name);
            for (const [t1, t2] of pairs) { if (t1 == name && !selectedOptions[options.indexOf(t2)]) inst.lock(t2); }
          }
          ownedItems.forEach(o => { if (o.to !== null && o.to !== undefined && o.to == a - 1) inst.release(o.name); });
          ownedItems.forEach(o => { if (o.from == a) inst.hold(o.name); });
          continue;
        }

        // Vouchers bought in the previous ante take effect now: they leave the
        // pool, unlock their tier-2 upgrade, and apply their shop effects.
        for (const name in voucherPurchases) {
          if (voucherPurchases[name] != a - 1) continue;
          inst.activateVoucher(name);
          for (const [t1, t2] of pairs) {
            // Keep the upgrade locked if the profile hasn't unlocked it
            if (t1 == name && !selectedOptions[options.indexOf(t2)]) inst.lock(t2);
          }
        }

        output += "==ANTE " + a + "==\n"
        if (resumingAnte(a)) {
          // Boss, voucher and tags for the saved ante were rolled when it began; the save's
          // blind_choices/blind_tags hold them, and their streams already sit past that roll.
          output += "Boss: " + resume.boss + "\n";
          output += "Voucher: " + resume.voucher + "\n";
          output += "Resumed from save: " + resume.label + "\n";
        } else {
          output += "Boss: " + inst.nextBoss(a) + "\n";
          output += "Voucher: " + inst.nextVoucher(a) + "\n";
        }
        var ownedNow = Object.keys(voucherPurchases).filter(n => voucherPurchases[n] <= a);
        if (ownedNow.length > 0) output += "Owned Vouchers: " + ownedNow.join(", ") + "\n";

        // Owned Jokers / consumables: lock what you hold this ante, release what you let go
        // of last ante. Ordered so a card released and re-acquired in the same ante stays locked.
        ownedItems.forEach(o => { if (o.to !== null && o.to !== undefined && o.to == a - 1) inst.release(o.name); });
        ownedItems.forEach(o => { if (o.from == a) inst.hold(o.name); });
        var heldNow = ownedItems.filter(o => heldAt(o, a)).map(o => o.name);
        if (heldNow.length > 0) output += "Owned Cards: " + heldNow.join(", ") + "\n";
        var tagList = [];
        var numTags = 2 + (extraTags[a] || 0);
        if (resumingAnte(a)) { tagList = resume.tags.slice(); for (let t = 2; t < numTags; t++) tagList.push(inst.nextTag(a)); }
        else for (let t = 0; t < numTags; t++) tagList.push(inst.nextTag(a));
        output += "Tags: " + tagList.join(", ") + "\n";

        // Sixth Sense: one Spectral per trigger, at most once per round (first hand a lone 6), so 3 per ante. Uses the
        // game's "sixth" source key, so it doesn't disturb any other RNG stream.
        var sixthSense = [];
        var numSixth = 3 * (1 + (extraSixth[a] || 0));
        for (let r = 0; r < numSixth; r++) {
          sixthSense.push(inst.nextSpectral("sixth", a, false));
        }
        output += "Sixth Sense: " + sixthSense.join(", ") + "\n";

        // Perkeo: at the end of each shop, copies one held consumable as a Negative. The
        // game does pseudorandom_element(G.consumeables.cards, pseudoseed('perkeo')). Unlike
        // the shop and pack keys, nothing appends the ante here, so it is ONE run-wide stream
        // ('perkeo') advanced once per shop from the shop you first hold Perkeo, confirmed on
        // AU4QHS35 (ante 3: shop 1 copied Immolate x3, shop 2 copied Immolate from a 5-card
        // pool where the per-ante key would have given Cryptid). The pick is an index into
        // your consumable slots in slot order, so held consumables are listed in acquisition
        // order. Only shown when Perkeo and at least one consumable are held; entry k is the
        // k-th shop of this ante.
        // Perkeo can fire more than once per shop (Blueprint / Brainstorm copies). Each
        // copy it makes lands in your slots before the next pull, so the pool grows by one
        // per trigger within the shop. Output is "card@shop/trigger" per entry.
        // The pool for shop `sh` is every consumable held this ante that was in your slots
        // by then: cards without a shop (bought before / during the blinds) plus copies from
        // shops <= sh, in acquisition order. Copies Perkeo already made this shop (recorded
        // as owned cards with perkeo:true) each count as an extra trigger, and the pick
        // after them is rolled from a pool that includes them.
        var perkeo = [];
        var ownedDirty = false;
        if (heldNow.includes("Perkeo")) {
          var numShops = shopsInAnte(a) + 3 * (extraSixth[a] || 0);
          var firstShop = resumingAnte(a) ? resume.perkeoFirstShop : 1;
          for (let sh = firstShop; sh <= numShops; sh++) {
            // Pool for shop sh = consumables in hand when that shop ends: everything from earlier
            // antes, cards of this ante with pos <= sh, and Perkeo copies from earlier shops of
            // this ante. Slot order = acquisition order: earlier antes first, then by position,
            // with a shop's Perkeo copies after that shop's purchases, then by record order.
            var slotKey = o => o.perkeo ? (o.shop + 0.5) : (o.pos || 1);
            var pool = ownedItems
              .filter(o => heldAt(o, a) && o.name != "Perkeo" && isConsumableName(o.name)
                && (o.from < a || (o.perkeo ? o.shop < sh : (o.pos || 1) <= sh)))
              .sort((x, y) => (x.from - y.from) || (slotKey(x) - slotKey(y)) || (parseInt(x.id.slice(1), 10) - parseInt(y.id.slice(1), 10)))
              .map(o => o.name);
            if (pool.length == 0) continue;
            // Extra triggers this shop = copies recorded here that were followed by another
            // trigger (kept:false). A kept copy is the final trigger's own result.
            // A recorded copy is by definition what trigger t produced, so its name follows
            // the computed pick: an upstream change (extra trigger, new consumable) shifts the
            // stream and the record must shift with it. Refreshed in order, so later pools see it.
            var recordedHere = ownedItems.filter(o => o.perkeo && o.from == a && o.shop == sh)
              .sort((x, y) => parseInt(x.id.slice(1), 10) - parseInt(y.id.slice(1), 10));
            var retriggers = recordedHere.filter(o => !o.kept).length;
            // One roll per shop; the engine's randint(0, n-1) is floor(roll * n), so the same
            // roll re-indexed against a bigger pool reproduces what a copied Perkeo produces.
            var roll = inst.random("perkeo");
            for (let t = 1; t <= retriggers + 1; t++) {
              if (PERKEO_PULL_PER_TRIGGER && t > 1) roll = inst.random("perkeo");
              var pick = pool[Math.floor(roll * pool.length)];
              perkeo.push(pick + "@" + sh + "/" + t);
              pool.push(pick);
              var rec = recordedHere[t - 1];
              if (rec && rec.name != pick) { rec.name = pick; ownedDirty = true; }
            }
          }
        }
        if (perkeo.length > 0) output += "Perkeo: " + perkeo.join(", ") + "\n";
        if (ownedDirty) saveOwnedState();

        // Joker / consumable generators, one line per source (see GENERATORS).
        // Each source key is its own per-ante RNG stream, so generating them here
        // does not disturb the shop, pack, or tag streams.
        //   - Jokers created outside the shop never get stake stickers. Rare/Uncommon Tag
        //     Jokers do land in the shop, but their sticker poll shares the shop's
        //     "etperpoll" stream, so it is left off to keep the shop queue stable.
        //   - The Soul's Legendary pool (1.0.1+) is one run-wide stream, key "Joker4".
        //     It is reset each ante so every ante lists the 1st, 2nd, ... Soul used in
        //     the run, while the edition roll ("edisou" + ante) stays per ante.
        GENERATORS.forEach(g => {
          var cards = [];
          if (g.source == "sou") {
            // Legendary pool is run-wide. Normally rewound each ante to list the 1st, 2nd, ...
            // Soul of the run; when resuming, rewind to the save's position instead.
            if (resume) Object.keys(resume.nodes).forEach(k => { if (k == "Joker4" || k.startsWith("Joker4_resample")) inst.setNode(k, resume.nodes[k]); });
            else inst.resetNode("Joker4");
          }
          for (let i = 0; i < g.count; i++) {
            if (g.kind == "joker") {
              var jkr = inst.nextJoker(g.source, a, false);
              var name = "";
              if (jkr.edition != "No Edition") name += jkr.edition + " ";
              name += jkr.joker;
              cards.push(name);
              jkr.delete();
            } else if (g.kind == "tarot") {
              cards.push(inst.nextTarot(g.source, a, false));
            } else if (g.kind == "spectral") {
              cards.push(inst.nextSpectral(g.source, a, false));
            } else if (g.kind == "planet") {
              cards.push(inst.nextPlanet(g.source, a, false));
            }
          }
          output += g.label + ": " + cards.join(", ") + "\n";
        });

        // Draw order for each round of this ante. Hand size: 8, +2 Painted Deck,
        // +1 each for Paint Brush and Palette once bought, plus the manual adjustment.
        var handSize = 8 + (deck == "Painted Deck" ? 2 : 0)
          + (ownedNow.includes("Paint Brush") ? 1 : 0) + (ownedNow.includes("Palette") ? 1 : 0) + deckHandAdjust;
        if (a == 1 && DRAW_RUN_START_SHUFFLE) { var startPerm = inst.nextShuffle(1, startCards.length); startPerm.delete(); }
        var numRounds = 3 + (extraRounds[a] || 0);
        var anteRounds = [];
        output += "Draw Order (hand " + handSize + "):\n";
        // Resumed ante: only the blinds still ahead shuffle (skipped blinds never did).
        var roundList = [];
        if (resumingAnte(a)) { roundList = resume.remainingRounds.slice(); for (let r = 4; r <= numRounds; r++) roundList.push(r); }
        else for (let r = 1; r <= numRounds; r++) roundList.push(r);
        for (const r of roundList) {
          var deckCards = deckAt(startCards, a, r);
          var perm = inst.nextShuffle(a, deckCards.length);
          var ordered = [];
          for (let i = 0; i < perm.size(); i++) ordered.push(deckCards[perm.get(i)]);
          perm.delete();
          if (!DRAW_FROM_END) ordered.reverse();
          anteRounds.push({ round: r, hand: handSize, cards: ordered, blind: resumingAnte(a) && r <= 3 ? resume.remainingBlindNames[resume.remainingRounds.indexOf(r)] : null });
          output += "Round " + r + " [" + ordered.length + "]: " + ordered.map(c => c.name).join(", ") + "\n";
        }
        deckRounds[a] = anteRounds;

        // Shop slots at this ante: 2 base, +1 Overstock, +1 Overstock Plus.
        // A voucher counts once bought in this ante or earlier, or granted by the deck.
        var ownedAt = (name) => (DECK_VOUCHERS[deck] || []).includes(name) || (voucherPurchases[name] !== undefined && voucherPurchases[name] <= a);
        var shopSlots = 2 + (ownedAt("Overstock") ? 1 : 0) + (ownedAt("Overstock Plus") ? 1 : 0);
        var shopCards = (framesPerAnte[a-1] || 0) * shopSlots;

        output += "Shop Queue (" + shopSlots + " cards per frame): \n";
        var qStart = 1;
        if (resumingAnte(a) && resume.currentShop) {
          // Frame 1 is the shop on screen, from the save. Rerolls follow from the stream.
          output += "Current Shop: " + resume.currentShop.cards.join(", ") + "\n";
          qStart = resume.currentShop.cards.length + 1;
          for (let q = 1; q < qStart; q++) output += q + ") " + resume.currentShop.cards[q - 1] + "\n";
        }
        for (let q = qStart; q <= shopCards; q++) {
          output += q + ") ";
          var item = inst.nextShopItem(a);
          if (item.type == "Joker") {
            var jokerData = item.jokerData;
            var stickers = jokerData.stickers;
            if (stickers.eternal) output += "Eternal ";
            if (stickers.perishable) output += "Perishable ";
            if (stickers.rental) output += "Rental ";
            if (jokerData.edition != "No Edition") output += jokerData.edition + " ";
            stickers.delete();
            jokerData.delete();
          }
          output += item.item + "\n";
          item.delete();
        }

        output += "\nPacks: \n";
        var numPacks = ((a == 1) ? 4 : 6) + (extraPacks[a] || 0);
        if (resumingAnte(a)) {
          numPacks = Math.max(0, 2 * (shopsInAnte(a) - resume.shopsRolled)) + (extraPacks[a] || 0);
          // Packs in the shop on screen: the save names them but not their contents, and their
          // content streams are already advanced past them, so they are listed by name only.
          if (resume.currentShop) resume.currentShop.packs.forEach(pk => { output += pk + " - (on screen now; open it in the game to see its contents)\n"; });
        }
        for (let p = 1; p <= numPacks; p++) {
          var pack = inst.nextPack(a);
          output += pack + " - ";
          var packInfo = Immolate.packInfo(pack);
          var packType = packInfo.type;
          var packSize = packInfo.size;
          packInfo.delete();
          if (packType == "Celestial Pack") {
            var cards = inst.nextCelestialPack(packSize, a);
            for (let c = 0; c < packSize; c++) {
              output += cards.get(c);
              output += (c + 1 != packSize) ? ", " : "";
            }
            cards.delete();
          }
          if (packType == "Arcana Pack") {
            var cards = inst.nextArcanaPack(packSize, a);
            for (let c = 0; c < packSize; c++) {
              output += cards.get(c);
              output += (c + 1 != packSize) ? ", " : "";
            }
            cards.delete();
          }
          if (packType == "Spectral Pack") {
            var cards = inst.nextSpectralPack(packSize, a);
            for (let c = 0; c < packSize; c++) {
              output += cards.get(c);
              output += (c + 1 != packSize) ? ", " : "";
            }
            cards.delete();
          }
          if (packType == "Buffoon Pack") {
            var cards = inst.nextBuffoonPack(packSize, a);
            for (let c = 0; c < packSize; c++) {
              var joker = cards.get(c);
              var jStickers = joker.stickers;
              if (jStickers.eternal) output += "Eternal ";
              if (jStickers.perishable) output += "Perishable ";
              if (jStickers.rental) output += "Rental ";
              if (joker.edition != "No Edition") output += joker.edition + " ";
              output += joker.joker;
              jStickers.delete();
              joker.delete();
              output += (c + 1 != packSize) ? ", " : "";
            }
            cards.delete();
          }
          if (packType == "Standard Pack") {
            var cards = inst.nextStandardPack(packSize, a);
            for (let c = 0; c < packSize; c++) {
              var card = cards.get(c);
              if (card.seal != "No Seal") output += card.seal + " ";
              if (card.edition != "No Edition") output += card.edition + " ";
              if (card.enhancement != "No Enhancement") output += card.enhancement + " ";
              var rank = card.base[2];
              if (rank == "T") output += "10";
              else if (rank == "J") output += "Jack";
              else if (rank == "Q") output += "Queen";
              else if (rank == "K") output += "King";
              else if (rank == "A") output += "Ace";
              else output += rank;
              output += " of ";
              var suit = card.base[0];
              if (suit == "C") output += "Clubs";
              else if (suit == "S") output += "Spades";
              else if (suit == "D") output += "Diamonds";
              else if (suit == "H") output += "Hearts";
              card.delete();
              output += (c + 1 != packSize) ? ", " : "";
            }
            cards.delete();
          }
          output += "\n";
        }

        output += "\n";
      };

      inst.delete();

      var statusEl = document.getElementById('importSaveStatus');
      if (resume && !statusEl.textContent.startsWith('Imported')) {
        statusEl.classList.remove('error');
        statusEl.textContent = 'Resuming from ' + resume.label + '. ';
        var forget = document.createElement('button'); forget.textContent = 'Forget save'; forget.className = 'smallButton';
        forget.addEventListener('click', () => window.saveResume.forget()); statusEl.appendChild(forget);
      } else if (!resume && statusEl.textContent.startsWith('Resuming')) statusEl.textContent = '';

      // Update output box with analysis result
      outputBox.value = output;
      document.dispatchEvent(new Event('analysisComplete'));
    }

    window.addEventListener('DOMContentLoaded', () => {
      const seedInput = document.getElementById('seed');
      const framesPerAnteInput = document.getElementById('framesPerAnte');
      const anteInput = document.getElementById('ante');
      const deckInput = document.getElementById('deck');
      const stakeInput = document.getElementById('stake');
      const versionInput = document.getElementById('version');

      // Get seed value from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const urlSeed = urlParams.get('seed');
      const urlAnte = urlParams.get('ante');
      const urlFramesPerAnte = urlParams.get('framesPerAnte');
      const urlDeck = urlParams.get('deck');
      const urlStake = urlParams.get('stake');
      const urlVersion = urlParams.get('version');
      const urlUnlocks = urlParams.get('unlocks');
      const urlVouchers = urlParams.get('vouchers');
      const urlExtraPacks = urlParams.get('extraPacks');
      const urlExtraTags = urlParams.get('extraTags');
      const urlExtraSixth = urlParams.get('extraSixth');

      if (urlExtraSixth) {
        urlExtraSixth.split(',').forEach(entry => {
          const [a, n] = entry.split(':').map(x => parseInt(x, 10));
          if (a >= 1 && n >= 1) extraSixth[a] = Math.min(n, 200);
        });
      }

      if (urlExtraTags) {
        urlExtraTags.split(',').forEach(entry => {
          const [a, n] = entry.split(':').map(x => parseInt(x, 10));
          if (a >= 1 && n >= 1) extraTags[a] = Math.min(n, 500);
        });
      }

      if (urlExtraPacks) {
        urlExtraPacks.split(',').forEach(entry => {
          const [a, n] = entry.split(':').map(x => parseInt(x, 10));
          if (a >= 1 && n >= 1) extraPacks[a] = Math.min(n, 500);
        });
      }

      if (urlVouchers) {
        urlVouchers.split(',').forEach(entry => {
          const idx = entry.lastIndexOf(':');
          if (idx <= 0) return;
          const boughtAnte = parseInt(entry.slice(idx + 1), 10);
          if (!isNaN(boughtAnte) && boughtAnte >= 1) voucherPurchases[entry.slice(0, idx)] = boughtAnte;
        });
      }

      const clampCountField = (input, value) => {
        input.value = Math.max(0, Math.min(999, parseInt(value, 10) || 0));
      };
      GENERATORS.forEach(g => {
        const v = urlParams.get(g.param);
        if (v !== null) clampCountField(document.getElementById(g.input), v);
      });

      if (urlUnlocks) {
        // Decode the base64 string
        const binaryString = atob(urlUnlocks)
          .split('')
          .map(char => char.charCodeAt(0).toString(2).padStart(8, '0'))
          .join('');

        // Remove the padding byte (if present)
        const paddingLength = binaryString.length % 8;
        const unpadded = paddingLength > 0 ? binaryString.slice(0, -paddingLength) : binaryString;

        // Convert the binary string back to an array of booleans
        const decodedUnlocks = unpadded.split('').map(bit => bit === '1');
        selectedOptions = decodedUnlocks;
      }

      // Set default seed value
      if (urlAnte) {
        anteInput.value = urlAnte;
        anteInput.value = Math.min(anteInput.value, 999);
        anteInput.value = Math.max(anteInput.value, 1);
        framesPerAnteInput.value = defaultFrames(anteInput.value);
        var input = framesPerAnteInput.value.split(',').map(Number);
        var fixedInput = []
        for (let i = 0; i < anteInput.value; i++) {
          if (input.length < i) {
            fixedInput.push(0);
          } else {
            fixedInput.push(input[i]);
          }
          if (fixedInput[i] == undefined) fixedInput[i] = 0;
          if (isNaN(fixedInput[i])) fixedInput[i] = 0;
        }
        framesPerAnteInput.value = fixedInput;
      }
      if (urlFramesPerAnte) {
        framesPerAnteInput.value = urlFramesPerAnte;
        var input = framesPerAnteInput.value.split(',').map(Number);
        var fixedInput = []
        for (let i = 0; i < anteInput.value; i++) {
          if (input.length < i) {
            fixedInput.push(0);
          } else {
            fixedInput.push(input[i]);
          }
          if (fixedInput[i] == undefined) fixedInput[i] = 0;
          if (isNaN(fixedInput[i])) fixedInput[i] = 0;
        }
        framesPerAnteInput.value = fixedInput;
      }
      if (urlDeck) {
        deckInput.value = urlDeck;
      }
      if (urlStake) {
        stakeInput.value = urlStake;
      }
      if (urlSeed) {
        seedInput.value = filterSeed(urlSeed);
        instantAnalysis = true;
      }
      if (urlVersion) {
        versionInput.value = urlVersion;
      }

      // Add event listener for input event
      seedInput.addEventListener('input', () => {
        seedInput.value = filterSeed(seedInput.value);
      });
      anteInput.addEventListener('input', () => {
        anteInput.value = Math.min(anteInput.value, 999);
        anteInput.value = Math.max(anteInput.value, 1);
        var input = framesPerAnteInput.value.split(',').map(Number);
        var fixedInput = []
        for (let i = 0; i < anteInput.value; i++) {
          if (input.length < i) {
            fixedInput.push(0);
          } else {
            fixedInput.push(input[i]);
          }
          if (fixedInput[i] == undefined) fixedInput[i] = 0;
          if (isNaN(fixedInput[i])) fixedInput[i] = 0;
        }
        framesPerAnteInput.value = fixedInput;
      });
      framesPerAnteInput.addEventListener('input', () => {
        var input = framesPerAnteInput.value.split(',').map(Number);
        var fixedInput = []
        for (let i = 0; i < anteInput.value; i++) {
          if (input.length < i) {
            fixedInput.push(0);
          } else {
            fixedInput.push(input[i]);
          }
          if (fixedInput[i] == undefined) fixedInput[i] = 0;
          if (isNaN(fixedInput[i])) fixedInput[i] = 0;
        }
        framesPerAnteInput.value = fixedInput;
      });

      function filterSeed(seed) {
        const filteredSeed = seed.replace(/[^A-Za-z0-9]/g, '').toUpperCase().replace(/0/g, 'O');

        // Truncate the seed if it's longer than 8 characters
        return filteredSeed.slice(0, 8);
      }
    });
  </script>
