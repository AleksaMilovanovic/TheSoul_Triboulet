<html>
  <script>
    var Immolate = {
      onRuntimeInitialized: function() {
        if (instantAnalysis) {
          performAnalysis();
        }
      }
    };

    // Helper function for vectors
    function asVector(arr) {
      var vectorInt = new Module.VectorStr();
      for (var i = 0; i < arr.length; i++) {
        vectorInt.push_back(arr[i]);
      }
      return vectorInt;
    }
  </script>

  <style>

  <script>
    // Every Joker / consumable generation source the analyzer surfaces, besides the shop,
    // packs, and Sixth Sense (which has its own trigger-based display). Each `source` is the
    // append key Balatro passes to create_card, so each one is its own per-ante RNG stream.
    //   kind: joker (rarity polled or forced by source), tarot, spectral, planet
    //   param: URL query parameter for the per-ante count (kept stable for old links)
    //   input: id of the count input in the settings form
    const GENERATORS = [
      // --- Joker Generation ---
      { group: 'joker', kind: 'joker', source: 'jud', label: 'Judgement',    param: 'judgement',   input: 'judgementCount',   def: 10, hint: 'Tarot: creates a random Joker' },
      { group: 'joker', kind: 'joker', source: 'rif', label: 'Riff-Raff',    param: 'riffRaff',    input: 'riffRaffCount',    def: 6,  hint: '2 Common Jokers per blind selected' },
      { group: 'joker', kind: 'joker', source: 'sou', label: 'The Soul',     param: 'soul',        input: 'soulCount',        def: 5,  hint: 'Legendary pool is run-wide: Nth Soul used in the run, edition rolled per ante' },
      { group: 'joker', kind: 'joker', source: 'wra', label: 'Wraith',       param: 'wraith',      input: 'wraithCount',      def: 5,  hint: 'Spectral: creates a random Rare Joker' },
      { group: 'joker', kind: 'joker', source: 'rta', label: 'Rare Tag',     param: 'rareTag',     input: 'rareTagCount',     def: 3,  hint: 'Next shop has a free Rare Joker' },
      { group: 'joker', kind: 'joker', source: 'uta', label: 'Uncommon Tag', param: 'uncommonTag', input: 'uncommonTagCount', def: 3,  hint: 'Next shop has a free Uncommon Joker' },
      { group: 'joker', kind: 'joker', source: 'top', label: 'Top-up Tag',   param: 'topUpTag',    input: 'topUpTagCount',    def: 6,  hint: 'Creates up to 2 Common Jokers' },
      // --- Consumable Generation ---
      { group: 'consumable', kind: 'tarot',    source: 'car', label: 'Cartomancer',         param: 'cartomancer',   input: 'cartomancerCount',   def: 20, hint: 'Tarot when a blind is selected' },
      { group: 'consumable', kind: 'tarot',    source: '8ba', label: '8 Ball / Purple Seal', param: 'eightBall',     input: 'eightBallCount',     def: 20, hint: 'Shared stream: 1 in 4 per 8 scored, or Purple Seal discarded' },
      { group: 'consumable', kind: 'tarot',    source: 'emp', label: 'Emperor',             param: 'emperor',       input: 'emperorCount',       def: 20, hint: 'Tarot: creates 2 random Tarots' },
      { group: 'consumable', kind: 'tarot',    source: 'van', label: 'Vagabond',            param: 'vagabond',      input: 'vagabondCount',      def: 10, hint: 'Tarot when a hand is played with $4 or less' },
      { group: 'consumable', kind: 'tarot',    source: 'sup', label: 'Superposition',       param: 'superposition', input: 'superpositionCount', def: 10, hint: 'Tarot when a Straight containing an Ace is played' },
      { group: 'consumable', kind: 'tarot',    source: 'hal', label: 'Hallucination',       param: 'hallucination', input: 'hallucinationCount', def: 10, hint: '1 in 2 chance of a Tarot when a Booster Pack is opened' },
      { group: 'consumable', kind: 'spectral', source: 'sea', label: 'Seance',              param: 'seance',        input: 'seanceCount',        def: 10, hint: 'Spectral when a Straight Flush is played' },
      { group: 'consumable', kind: 'planet',   source: 'pri', label: 'High Priestess',      param: 'highPriestess', input: 'highPriestessCount', def: 10, hint: 'Tarot: creates 2 random Planets' },
    ];
    window.GENERATORS = GENERATORS;

    // Build the count inputs for the two collapsible settings groups.
    GENERATORS.forEach(g => {
      const holder = document.getElementById(g.group === 'joker' ? 'jokerGenInputs' : 'consumableGenInputs');
      const label = document.createElement('label');
      label.htmlFor = g.input;
      label.textContent = g.label + ':';
      label.title = g.hint;
      const input = document.createElement('input');
      input.type = 'number'; input.id = g.input; input.min = 0; input.max = 999; input.value = g.def; input.required = true;
      input.title = g.hint;
      holder.appendChild(label);
      holder.appendChild(input);
      holder.appendChild(document.createElement('br'));
    });

    //Unlocks stuff
    // Option values
    const options = ["Negative Tag",
                    "Foil Tag",
                    "Holographic Tag",
                    "Polychrome Tag",
                    "Rare Tag",
                    "Golden Ticket",
                    "Mr. Bones",
                    "Acrobat",
                    "Sock and Buskin",
                    "Swashbuckler",
                    "Troubadour",
                    "Certificate",
                    "Smeared Joker",
                    "Throwback",
                    "Hanging Chad",
                    "Rough Gem",
                    "Bloodstone",
                    "Arrowhead",
                    "Onyx Agate",
                    "Glass Joker",
                    "Showman",
                    "Flower Pot",
                    "Blueprint",
                    "Wee Joker",
                    "Merry Andy",
                    "Oops! All 6s",
                    "The Idol",
                    "Seeing Double",
                    "Matador",
                    "Hit the Road",
                    "The Duo",
                    "The Trio",
                    "The Family",
                    "The Order",
                    "The Tribe",
                    "Stuntman",
                    "Invisible Joker",
                    "Brainstorm",
                    "Satellite",
                    "Shoot the Moon",
                    "Driver's License",
                    "Cartomancer",
                    "Astronomer",
                    "Burnt Joker",
                    "Bootstraps",
                    "Overstock Plus",
                    "Liquidation",
                    "Glow Up",
                    "Reroll Glut",
                    "Omen Globe",
                    "Observatory",
                    "Nacho Tong",
                    "Recyclomancy",
                    "Tarot Tycoon",
                    "Planet Tycoon",
                    "Money Tree",
                    "Antimatter",
                    "Illusion",
                    "Petroglyph",
                    "Retcon",
                    "Palette"]
    selectedOptions = Array(61).fill(true);

    // Get references to elements
    const openCheckboxesBtn = document.getElementById('openCheckboxesBtn');
    const checkboxesOverlay = document.getElementById('checkboxesOverlay');
    const checkboxesPopup = document.getElementById('checkboxesPopup');
    const checkboxesContainer = document.getElementById('checkboxesContainer');
    const submitBtn = document.getElementById('submitBtn');
    const lockBtn = document.getElementById('lockBtn');
    const unlockBtn = document.getElementById('unlockBtn');

    // Function to create checkboxes
    function createCheckboxes() {
      checkboxesContainer.innerHTML = '';
      const numColumns = 6;
      const optionsPerColumn = Math.ceil(options.length / numColumns);

      for (let i = 0; i < numColumns; i++) {
        const columnDiv = document.createElement('div');
        columnDiv.classList.add('checkbox-column');

        for (let j = i * optionsPerColumn; j < (i + 1) * optionsPerColumn && j < options.length; j++) {
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = options[j];
          checkbox.checked = selectedOptions[j]; // Set checkboxes as selected by default
          const label = document.createElement('label');
          label.textContent = options[j];
          label.prepend(checkbox);
          columnDiv.appendChild(label);
        }

        checkboxesContainer.appendChild(columnDiv);
      }
    }

    // Function to handle checkbox selections
    function handleSubmit() {
      const checkboxes = checkboxesContainer.querySelectorAll('input[type="checkbox"]');
      selectedOptions = [];
      checkboxes.forEach(checkbox => {
        selectedOptions.push(checkbox.checked);
      });
      console.log('Selected Options:', selectedOptions);
      // Do something with the selected options
      closeOverlay();
    }
    function handleLock() {
      const checkboxes = checkboxesContainer.querySelectorAll('input[type="checkbox"]');
      selectedOptions = [];
      checkboxes.forEach(checkbox => {
        checkbox.checked = false
      });
    }
    function handleUnlock() {
      const checkboxes = checkboxesContainer.querySelectorAll('input[type="checkbox"]');
      selectedOptions = [];
      checkboxes.forEach(checkbox => {
        checkbox.checked = true
      });
    }

    // Function to open the checkbox overlay
    function openOverlay() {
      createCheckboxes();
      checkboxesOverlay.style.display = 'block';
    }

    // Function to close the checkbox overlay
    function closeOverlay() {
      checkboxesOverlay.style.display = 'none';
    }

    // Event listeners
    openCheckboxesBtn.addEventListener('click', openOverlay);
    window.addEventListener('click', (event) => {
      if (event.target == checkboxesOverlay) {
        closeOverlay();
      }
    });
    submitBtn.addEventListener('click', handleSubmit);
    lockBtn.addEventListener('click', handleLock);
    unlockBtn.addEventListener('click', handleUnlock);


    // Default shop frames: 5 in ante 1, rising by 5 each ante
    function defaultFrames(numAntes) {
      var out = [];
      for (let i = 1; i <= numAntes; i++) out.push(5 * i);
      return out.join(',');
    }

    // Voucher purchase tracking for run-guide use: voucher name -> ante it was bought in.
    // Nothing is assumed bought; the offered voucher for each ante is rolled against
    // what you have actually marked as owned before that ante.
    var voucherPurchases = {};
    // Extra packs revealed per ante (ante -> count beyond the game's default 4/6).
    var extraPacks = {};
    window.packState = {
      extra: extraPacks,
      more: function(ante) { extraPacks[ante] = (extraPacks[ante] || 0) + 1; performAnalysis(); },
      reset: function(ante) { delete extraPacks[ante]; performAnalysis(); }
    };
    // Extra tags revealed per ante (ante -> count beyond the game's default 2).
    var extraTags = {};
    window.tagState = {
      extra: extraTags,
      more: function(ante) { extraTags[ante] = (extraTags[ante] || 0) + 1; performAnalysis(); },
      reset: function(ante) { delete extraTags[ante]; performAnalysis(); }
    };
    // Extra Sixth Sense triggers revealed per ante (ante -> extra sets of 3, for
    // replaying an ante after Hieroglyph/Petroglyph).
    var extraSixth = {};
    window.sixthState = {
      extra: extraSixth,
      more: function(ante) { extraSixth[ante] = (extraSixth[ante] || 0) + 1; performAnalysis(); },
      reset: function(ante) { delete extraSixth[ante]; performAnalysis(); }
    };
    const DECK_VOUCHERS = {
      "Magic Deck": ["Crystal Ball"],
      "Nebula Deck": ["Telescope"],
      "Zodiac Deck": ["Tarot Merchant", "Planet Merchant", "Overstock"]
    };
    function voucherPairs() {
      var pairs = [];
      for (let i = 0; i < Immolate.VOUCHERS.size(); i += 2) {
        pairs.push([Immolate.VOUCHERS.get(i), Immolate.VOUCHERS.get(i + 1)]);
      }
      return pairs;
    }
    window.voucherState = {
      purchases: voucherPurchases,
      get pairs() { return voucherPairs(); },
      get deckVouchers() { return DECK_VOUCHERS[document.getElementById('deck').value] || []; },
      buy: function(name, ante) {
        voucherPurchases[name] = ante;
        performAnalysis();
      },
      unbuy: function(name) {
        delete voucherPurchases[name];
        // Dropping a tier-1 voucher also drops its tier-2 upgrade.
        voucherPairs().forEach(([t1, t2]) => { if (t1 == name) delete voucherPurchases[t2]; });
        performAnalysis();
      }
    };

    // ---- Deck tracking + draw order ----
    // Balatro shuffles the whole deck at run start and at the start of every blind
    // (CardArea:shuffle('nr'..ante)), so each round's draw order is a fixed permutation of
    // whatever the deck holds at that moment. Plays and discards never change what comes
    // next; only adding or removing cards does. Deck changes are recorded as ops that take
    // effect from a given (ante, round) and are kept in localStorage per seed + deck. They
    // are deliberately not part of the share link.
    // Calibrated against seed 11111111, Red Deck, 1.0.1n: the first pull of 'nr1' is the
    // round 1 draw order and the second pull is round 2, dealt from the end of the list.
    // The run-start shuffle therefore does not consume a pull from this stream.
    const DRAW_RUN_START_SHUFFLE = false;
    const DRAW_FROM_END = true;
    var deckOps = [];        // { type:'add', id, name, ante, round, seq } | { type:'remove', target, ante, round, seq }
    var deckRounds = {};     // ante -> [{ hand, cards: [{ id, name }] }], rebuilt by performAnalysis
    var extraRounds = {};    // ante -> extra rounds revealed (replaying an ante after Hieroglyph/Petroglyph)
    var deckHandAdjust = 0;  // manual hand-size tweak (Juggler, Stuntman, Turtle Bean, ...)
    var deckSeq = 0;
    var deckStoreKey = null;

    function cardCodeToName(code) {
      const ranks = { T: "10", J: "Jack", Q: "Queen", K: "King", A: "Ace" };
      const suits = { C: "Clubs", D: "Diamonds", H: "Hearts", S: "Spades" };
      return (ranks[code[2]] || code[2]) + " of " + suits[code[0]];
    }

    // Starting deck in sort_id order. start_run builds one proto per entry of G.P_CARDS
    // (dropping faces for Abandoned, remapping C->S and D->H for Checkered, or 52 seeded
    // picks for Erratic), then table.sort()s them by suit..rank string before creating the
    // cards, so creation order is plain string order of the "S_R" codes.
    function startingDeck(inst, deck) {
      var protos = [];
      if (deck == "Erratic Deck") {
        for (let i = 0; i < 52; i++) protos.push(Immolate.CARDS.get(inst.randint("erratic", 0, 51)));
      } else {
        for (let i = 0; i < Immolate.CARDS.size(); i++) {
          var c = Immolate.CARDS.get(i);
          if (deck == "Abandoned Deck" && "JQK".includes(c[2])) continue;
          if (deck == "Checkered Deck") c = (c[0] == "C" ? "S" : c[0] == "D" ? "H" : c[0]) + c.slice(1);
          protos.push(c);
        }
      }
      protos.sort();
      return protos;
    }

    // Deck contents when round r of ante a is shuffled: starting cards plus added cards
    // (in acquisition order, which is what sort_id follows), minus removed ones.
    function deckAt(startCards, a, r) {
      const eff = (op) => op.ante < a || (op.ante == a && op.round <= r);
      var cards = startCards.map((code, i) => ({ id: 's' + i, name: cardCodeToName(code) }));
      deckOps.filter(op => op.type == 'add' && eff(op))
        .sort((x, y) => (x.ante - y.ante) || (x.round - y.round) || (x.seq - y.seq))
        .forEach(op => cards.push({ id: op.id, name: op.name }));
      var removed = new Set(deckOps.filter(op => op.type == 'remove' && eff(op)).map(op => op.target));
      return cards.filter(c => !removed.has(c.id));
    }

    function saveDeckState() {
      try {
        localStorage.setItem(deckStoreKey, JSON.stringify({ ops: deckOps, handAdjust: deckHandAdjust, extraRounds: extraRounds, seq: deckSeq }));
      } catch (e) { /* storage unavailable: state lives for this page only */ }
    }
    function loadDeckState(seed, deck) {
      var key = 'theSoulDeck:' + seed + ':' + deck;
      if (key == deckStoreKey) return;
      deckStoreKey = key;
      deckOps.length = 0; deckHandAdjust = 0; deckSeq = 0;
      Object.keys(extraRounds).forEach(k => delete extraRounds[k]);
      try {
        var st = JSON.parse(localStorage.getItem(key));
        if (st) {
          (st.ops || []).forEach(o => deckOps.push(o));
          deckHandAdjust = st.handAdjust || 0;
          Object.assign(extraRounds, st.extraRounds || {});
          deckSeq = st.seq || 0;
        }
      } catch (e) { /* corrupt or missing entry: start clean */ }
    }
    function deckChanged() { saveDeckState(); performAnalysis(); }

    window.deckState = {
      rounds: deckRounds,
      ops: deckOps,
      extra: extraRounds,
      get handAdjust() { return deckHandAdjust; },
      setHandAdjust: function(n) { deckHandAdjust = Math.max(-7, Math.min(20, parseInt(n, 10) || 0)); deckChanged(); },
      // Card joins the deck from round `round` of ante `ante` (e.g. bought after the Small Blind -> round 2).
      add: function(name, ante, round) {
        deckSeq++;
        deckOps.push({ type: 'add', id: 'c' + deckSeq, name: name, ante: ante, round: round, seq: deckSeq });
        deckChanged();
      },
      // Card leaves the deck from round `round` of ante `ante` (destroyed during the round before).
      remove: function(id, name, ante, round) {
        deckSeq++;
        deckOps.push({ type: 'remove', target: id, name: name, ante: ante, round: round, seq: deckSeq });
        deckChanged();
      },
      undo: function(seq) {
        var idx = deckOps.findIndex(op => op.seq == seq);
        if (idx < 0) return;
        var op = deckOps[idx];
        deckOps.splice(idx, 1);
        // Dropping an added card also drops any removal recorded against it.
        if (op.type == 'add') for (let i = deckOps.length - 1; i >= 0; i--) if (deckOps[i].type == 'remove' && deckOps[i].target == op.id) deckOps.splice(i, 1);
        deckChanged();
      },
      clear: function() { deckOps.length = 0; deckHandAdjust = 0; Object.keys(extraRounds).forEach(k => delete extraRounds[k]); deckChanged(); },
      moreRounds: function(ante) { extraRounds[ante] = (extraRounds[ante] || 0) + 1; deckChanged(); },
      resetRounds: function(ante) { delete extraRounds[ante]; deckChanged(); }
    };

    // ---- Owned Jokers / consumables ----
    // Balatro locks a Joker or consumable you hold out of every pool (G.GAME.used_jokers):
    // if a stream would produce it, the game retries that one draw on <key>_resample2,
    // _resample3, ... until it finds something you don't hold. randchoice() in the engine
    // already does exactly this for anything lock()ed, so ownership is modelled by locking
    // each owned card at the ante you get it and unlocking it at the ante you lose it.
    // Showman (params.showman) turns the whole check off, as in the game.
    // Kept in localStorage per seed + deck, never in the share link.
    var ownedItems = [];     // { id, name, from, to } : held from ante `from` up to and including ante `to` (null = still held)
    var ownedShowman = false;
    var ownedSeq = 0;
    var ownedStoreKey = null;

    function saveOwnedState() {
      try { localStorage.setItem(ownedStoreKey, JSON.stringify({ items: ownedItems, showman: ownedShowman, seq: ownedSeq })); } catch (e) { /* page-only */ }
    }
    function loadOwnedState(seed, deck) {
      var key = 'theSoulOwned:' + seed + ':' + deck;
      if (key == ownedStoreKey) return;
      ownedStoreKey = key;
      ownedItems.length = 0; ownedShowman = false; ownedSeq = 0;
      try {
        var st = JSON.parse(localStorage.getItem(key));
        if (st) { (st.items || []).forEach(o => ownedItems.push(o)); ownedShowman = !!st.showman; ownedSeq = st.seq || 0; }
      } catch (e) { /* start clean */ }
    }
    function ownedChanged() { saveOwnedState(); performAnalysis(); }
    function heldAt(item, a) { return item.from <= a && (item.to === null || item.to === undefined || a <= item.to); }

    window.ownedState = {
      items: ownedItems,
      get showman() { return ownedShowman; },
      setShowman: function(on) { ownedShowman = !!on; ownedChanged(); },
      heldAt: heldAt,
      // Card acquired in ante `ante` (in the game it leaves the pools the moment you hold it,
      // so every queue from that ante on rerolls around it).
      add: function(name, ante) {
        ownedSeq++;
        ownedItems.push({ id: 'o' + ownedSeq, name: name, from: ante, to: null });
        ownedChanged();
      },
      // Card sold / used / destroyed during ante `ante`: still held for that ante, back in
      // the pools from the next ante on.
      release: function(id, ante) {
        var it = ownedItems.find(o => o.id == id);
        if (it) { it.to = ante; ownedChanged(); }
      },
      unrelease: function(id) {
        var it = ownedItems.find(o => o.id == id);
        if (it) { it.to = null; ownedChanged(); }
      },
      remove: function(id) {
        var idx = ownedItems.findIndex(o => o.id == id);
        if (idx >= 0) { ownedItems.splice(idx, 1); ownedChanged(); }
      },
      clear: function() { ownedItems.length = 0; ownedShowman = false; ownedChanged(); }
    };

    instantAnalysis = false;

    const anteInput = document.getElementById('ante');
    const framesPerAnteInput = document.getElementById('framesPerAnte');
    GENERATORS.forEach(g => { g.el = document.getElementById(g.input); });
    const deckSelect = document.getElementById('deck');
    const stakeSelect = document.getElementById('stake');
    const versionSelect = document.getElementById('version');
    const seedInput = document.getElementById('seed');
    const analyzeButton = document.getElementById('analyzeButton');
    const copyLinkButton = document.getElementById('copyButton');
    const downloadButton = document.getElementById('downloadButton');
    const outputBox = document.getElementById('outputBox');
    
    // Add event listener for the "Copy Link" button
    copyLinkButton.addEventListener('click', copyLink);

    function copyLink() {
      const baseUrl = window.location.origin + window.location.pathname;
      const params = new URLSearchParams();

      // Hash the unlocks
      // Convert the array of booleans to a binary string
      const binaryString = selectedOptions.map(unlock => unlock ? '1' : '0').join('');

      // Convert the binary string to a byte array
      const byteArray = [];
      for (let i = 0; i < binaryString.length; i += 8) {
        const byte = parseInt(binaryString.substr(i, 8), 2);
        byteArray.push(byte);
      }

      // Pad the byte array with a null byte if necessary
      if (binaryString.length % 8 !== 0) {
        const paddingBits = '0'.repeat(8 - (binaryString.length % 8));
        const paddingByte = parseInt(`${binaryString.slice(-binaryString.length % 8)}${paddingBits}`, 2);
        byteArray.push(paddingByte);
      }

      // Encode the byte array to base64
      const base64Unlocks = btoa(String.fromCharCode.apply(null, byteArray));

      // Add non-default input values as URL parameters
      if (anteInput.value !== '38') params.append('ante', anteInput.value);
      if (framesPerAnteInput.value !== defaultFrames(38)) params.append('framesPerAnte', framesPerAnteInput.value);
      GENERATORS.forEach(g => { if (g.el.value !== String(g.def)) params.append(g.param, g.el.value); });
      if (deckSelect.value !== 'Red Deck') params.append('deck', deckSelect.value);
      if (stakeSelect.value !== 'White Stake') params.append('stake', stakeSelect.value);
      if (versionSelect.value != '10106') params.append('version', versionSelect.value);
      if (seedInput.value !== '') params.append('seed', seedInput.value);
      const purchaseList = Object.keys(voucherPurchases).map(n => n + ':' + voucherPurchases[n]).join(',');
      if (purchaseList !== '') params.append('vouchers', purchaseList);
      const extraPackList = Object.keys(extraPacks).filter(a => extraPacks[a] > 0).map(a => a + ':' + extraPacks[a]).join(',');
      if (extraPackList !== '') params.append('extraPacks', extraPackList);
      const extraTagList = Object.keys(extraTags).filter(a => extraTags[a] > 0).map(a => a + ':' + extraTags[a]).join(',');
      if (extraTagList !== '') params.append('extraTags', extraTagList);
      const extraSixthList = Object.keys(extraSixth).filter(a => extraSixth[a] > 0).map(a => a + ':' + extraSixth[a]).join(',');
      if (extraSixthList !== '') params.append('extraSixth', extraSixthList);
      if (base64Unlocks != '/////////x/4') params.append('unlocks', base64Unlocks);

      const url = `${baseUrl}?${params.toString()}`;

      // Copy the URL to the clipboard
      navigator.clipboard.writeText(url)
        .then(() => {
          alert('Link copied to clipboard!');
        })
        .catch((err) => {
          console.error('Failed to copy link: ', err);
        });
    }

    downloadButton.addEventListener('click', () => {
      const filename = seedInput.value + "_analysis.txt";
      const content = outputBox.value;

      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();

      URL.revokeObjectURL(url);
    });

    // Add event listener to the "Analysis" button
    analyzeButton.addEventListener('click', performAnalysis);

    function performAnalysis() {
      // Get input values
      const ante = parseInt(anteInput.value, 10);
      const framesPerAnte = framesPerAnteInput.value.split(',').map(Number);
      const clampCount = (v) => Math.max(0, Math.min(999, parseInt(v, 10) || 0));
      GENERATORS.forEach(g => { g.count = clampCount(g.el.value); });
      const deck = deckSelect.value;
      const stake = stakeSelect.value;
      const version = parseInt(versionSelect.value);
      const seed = seedInput.value.toUpperCase().replace(/0/g, 'O');

      output = "";

      // It's analysis time!
      var inst = new Immolate.Instance(seed);
      // Every embind object handed back to JS owns a wasm heap allocation and must be
      // .delete()d, including nested ones returned by property reads (jokerData,
      // stickers). Leaking them exhausts the fixed-size wasm heap after ~10 analyses.
      var instParams = new Immolate.InstParams(deck, stake, false, version);
      inst.params = instParams;
      instParams.delete();
      inst.initLocks(1, false, false);
      inst.lock("Overstock Plus");
      inst.lock("Liquidation");
      inst.lock("Glow Up");
      inst.lock("Reroll Glut");
      inst.lock("Omen Globe");
      inst.lock("Observatory");
      inst.lock("Nacho Tong");
      inst.lock("Recyclomancy");
      inst.lock("Tarot Tycoon");
      inst.lock("Planet Tycoon");
      inst.lock("Money Tree");
      inst.lock("Antimatter");
      inst.lock("Illusion");
      inst.lock("Petroglyph");
      inst.lock("Retcon");
      inst.lock("Palette");
      for (let i = 0; i < options.length; i++) {
        if (selectedOptions[i] == false) inst.lock(options[i]);
      }
      inst.setStake(stake);
      inst.setDeck(deck);
      var ghostDeck = (deck == "Ghost Deck");
      loadDeckState(seed, deck);
      loadOwnedState(seed, deck);
      if (ownedShowman) { var sp = inst.params; sp.showman = true; inst.params = sp; sp.delete(); }
      var startCards = startingDeck(inst, deck);
      Object.keys(deckRounds).forEach(k => delete deckRounds[k]);
      var pairs = voucherPairs();
      (DECK_VOUCHERS[deck] || []).forEach(dv => {
        for (const [t1, t2] of pairs) {
          if (t1 == dv && !selectedOptions[options.indexOf(t2)]) inst.lock(t2);
        }
      });
      for (let a = 1; a <= ante; a++) {
        inst.initUnlocks(a, false);

        // Vouchers bought in the previous ante take effect now: they leave the
        // pool, unlock their tier-2 upgrade, and apply their shop effects.
        for (const name in voucherPurchases) {
          if (voucherPurchases[name] != a - 1) continue;
          inst.activateVoucher(name);
          for (const [t1, t2] of pairs) {
            // Keep the upgrade locked if the profile hasn't unlocked it
            if (t1 == name && !selectedOptions[options.indexOf(t2)]) inst.lock(t2);
          }
        }

        output += "==ANTE " + a + "==\n"
        output += "Boss: " + inst.nextBoss(a) + "\n";
        output += "Voucher: " + inst.nextVoucher(a) + "\n";
        var ownedNow = Object.keys(voucherPurchases).filter(n => voucherPurchases[n] <= a);
        if (ownedNow.length > 0) output += "Owned Vouchers: " + ownedNow.join(", ") + "\n";

        // Owned Jokers / consumables: lock what you hold this ante, release what you let go
        // of last ante. Ordered so a card released and re-acquired in the same ante stays locked.
        ownedItems.forEach(o => { if (o.to !== null && o.to !== undefined && o.to == a - 1) inst.unlock(o.name); });
        ownedItems.forEach(o => { if (o.from == a) inst.lock(o.name); });
        var heldNow = ownedItems.filter(o => heldAt(o, a)).map(o => o.name);
        if (heldNow.length > 0) output += "Owned Cards: " + heldNow.join(", ") + "\n";
        var tagList = [];
        var numTags = 2 + (extraTags[a] || 0);
        for (let t = 0; t < numTags; t++) tagList.push(inst.nextTag(a));
        output += "Tags: " + tagList.join(", ") + "\n";

        // Sixth Sense: one Spectral per trigger, at most once per round (first hand a lone 6), so 3 per ante. Uses the
        // game's "sixth" source key, so it doesn't disturb any other RNG stream.
        var sixthSense = [];
        var numSixth = 3 * (1 + (extraSixth[a] || 0));
        for (let r = 0; r < numSixth; r++) {
          sixthSense.push(inst.nextSpectral("sixth", a, false));
        }
        output += "Sixth Sense: " + sixthSense.join(", ") + "\n";

        // Joker / consumable generators, one line per source (see GENERATORS).
        // Each source key is its own per-ante RNG stream, so generating them here
        // does not disturb the shop, pack, or tag streams.
        //   - Jokers created outside the shop never get stake stickers. Rare/Uncommon Tag
        //     Jokers do land in the shop, but their sticker poll shares the shop's
        //     "etperpoll" stream, so it is left off to keep the shop queue stable.
        //   - The Soul's Legendary pool (1.0.1+) is one run-wide stream, key "Joker4".
        //     It is reset each ante so every ante lists the 1st, 2nd, ... Soul used in
        //     the run, while the edition roll ("edisou" + ante) stays per ante.
        GENERATORS.forEach(g => {
          var cards = [];
          if (g.source == "sou") inst.resetNode("Joker4");
          for (let i = 0; i < g.count; i++) {
            if (g.kind == "joker") {
              var jkr = inst.nextJoker(g.source, a, false);
              var name = "";
              if (jkr.edition != "No Edition") name += jkr.edition + " ";
              name += jkr.joker;
              cards.push(name);
              jkr.delete();
            } else if (g.kind == "tarot") {
              cards.push(inst.nextTarot(g.source, a, false));
            } else if (g.kind == "spectral") {
              cards.push(inst.nextSpectral(g.source, a, false));
            } else if (g.kind == "planet") {
              cards.push(inst.nextPlanet(g.source, a, false));
            }
          }
          output += g.label + ": " + cards.join(", ") + "\n";
        });

        // Draw order for each round of this ante. Hand size: 8, +2 Painted Deck,
        // +1 each for Paint Brush and Palette once bought, plus the manual adjustment.
        var handSize = 8 + (deck == "Painted Deck" ? 2 : 0)
          + (ownedNow.includes("Paint Brush") ? 1 : 0) + (ownedNow.includes("Palette") ? 1 : 0) + deckHandAdjust;
        if (a == 1 && DRAW_RUN_START_SHUFFLE) { var startPerm = inst.nextShuffle(1, startCards.length); startPerm.delete(); }
        var numRounds = 3 + (extraRounds[a] || 0);
        var anteRounds = [];
        output += "Draw Order (hand " + handSize + "):\n";
        for (let r = 1; r <= numRounds; r++) {
          var deckCards = deckAt(startCards, a, r);
          var perm = inst.nextShuffle(a, deckCards.length);
          var ordered = [];
          for (let i = 0; i < perm.size(); i++) ordered.push(deckCards[perm.get(i)]);
          perm.delete();
          if (!DRAW_FROM_END) ordered.reverse();
          anteRounds.push({ hand: handSize, cards: ordered });
          output += "Round " + r + " [" + ordered.length + "]: " + ordered.map(c => c.name).join(", ") + "\n";
        }
        deckRounds[a] = anteRounds;

        // Shop slots at this ante: 2 base, +1 Overstock, +1 Overstock Plus.
        // A voucher counts once bought in this ante or earlier, or granted by the deck.
        var ownedAt = (name) => (DECK_VOUCHERS[deck] || []).includes(name) || (voucherPurchases[name] !== undefined && voucherPurchases[name] <= a);
        var shopSlots = 2 + (ownedAt("Overstock") ? 1 : 0) + (ownedAt("Overstock Plus") ? 1 : 0);
        var shopCards = (framesPerAnte[a-1] || 0) * shopSlots;

        output += "Shop Queue (" + shopSlots + " cards per frame): \n";
        for (let q = 1; q <= shopCards; q++) {
          output += q + ") ";
          var item = inst.nextShopItem(a);
          if (item.type == "Joker") {
            var jokerData = item.jokerData;
            var stickers = jokerData.stickers;
            if (stickers.eternal) output += "Eternal ";
            if (stickers.perishable) output += "Perishable ";
            if (stickers.rental) output += "Rental ";
            if (jokerData.edition != "No Edition") output += jokerData.edition + " ";
            stickers.delete();
            jokerData.delete();
          }
          output += item.item + "\n";
          item.delete();
        }

        output += "\nPacks: \n";
        var numPacks = ((a == 1) ? 4 : 6) + (extraPacks[a] || 0);
        for (let p = 1; p <= numPacks; p++) {
          var pack = inst.nextPack(a);
          output += pack + " - ";
          var packInfo = Immolate.packInfo(pack);
          var packType = packInfo.type;
          var packSize = packInfo.size;
          packInfo.delete();
          if (packType == "Celestial Pack") {
            var cards = inst.nextCelestialPack(packSize, a);
            for (let c = 0; c < packSize; c++) {
              output += cards.get(c);
              output += (c + 1 != packSize) ? ", " : "";
            }
            cards.delete();
          }
          if (packType == "Arcana Pack") {
            var cards = inst.nextArcanaPack(packSize, a);
            for (let c = 0; c < packSize; c++) {
              output += cards.get(c);
              output += (c + 1 != packSize) ? ", " : "";
            }
            cards.delete();
          }
          if (packType == "Spectral Pack") {
            var cards = inst.nextSpectralPack(packSize, a);
            for (let c = 0; c < packSize; c++) {
              output += cards.get(c);
              output += (c + 1 != packSize) ? ", " : "";
            }
            cards.delete();
          }
          if (packType == "Buffoon Pack") {
            var cards = inst.nextBuffoonPack(packSize, a);
            for (let c = 0; c < packSize; c++) {
              var joker = cards.get(c);
              var jStickers = joker.stickers;
              if (jStickers.eternal) output += "Eternal ";
              if (jStickers.perishable) output += "Perishable ";
              if (jStickers.rental) output += "Rental ";
              if (joker.edition != "No Edition") output += joker.edition + " ";
              output += joker.joker;
              jStickers.delete();
              joker.delete();
              output += (c + 1 != packSize) ? ", " : "";
            }
            cards.delete();
          }
          if (packType == "Standard Pack") {
            var cards = inst.nextStandardPack(packSize, a);
            for (let c = 0; c < packSize; c++) {
              var card = cards.get(c);
              if (card.seal != "No Seal") output += card.seal + " ";
              if (card.edition != "No Edition") output += card.edition + " ";
              if (card.enhancement != "No Enhancement") output += card.enhancement + " ";
              var rank = card.base[2];
              if (rank == "T") output += "10";
              else if (rank == "J") output += "Jack";
              else if (rank == "Q") output += "Queen";
              else if (rank == "K") output += "King";
              else if (rank == "A") output += "Ace";
              else output += rank;
              output += " of ";
              var suit = card.base[0];
              if (suit == "C") output += "Clubs";
              else if (suit == "S") output += "Spades";
              else if (suit == "D") output += "Diamonds";
              else if (suit == "H") output += "Hearts";
              card.delete();
              output += (c + 1 != packSize) ? ", " : "";
            }
            cards.delete();
          }
          output += "\n";
        }

        output += "\n";
      };

      inst.delete();

      // Update output box with analysis result
      outputBox.value = output;
      document.dispatchEvent(new Event('analysisComplete'));
    }

    window.addEventListener('DOMContentLoaded', () => {
      const seedInput = document.getElementById('seed');
      const framesPerAnteInput = document.getElementById('framesPerAnte');
      const anteInput = document.getElementById('ante');
      const deckInput = document.getElementById('deck');
      const stakeInput = document.getElementById('stake');
      const versionInput = document.getElementById('version');

      // Get seed value from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const urlSeed = urlParams.get('seed');
      const urlAnte = urlParams.get('ante');
      const urlFramesPerAnte = urlParams.get('framesPerAnte');
      const urlDeck = urlParams.get('deck');
      const urlStake = urlParams.get('stake');
      const urlVersion = urlParams.get('version');
      const urlUnlocks = urlParams.get('unlocks');
      const urlVouchers = urlParams.get('vouchers');
      const urlExtraPacks = urlParams.get('extraPacks');
      const urlExtraTags = urlParams.get('extraTags');
      const urlExtraSixth = urlParams.get('extraSixth');

      if (urlExtraSixth) {
        urlExtraSixth.split(',').forEach(entry => {
          const [a, n] = entry.split(':').map(x => parseInt(x, 10));
          if (a >= 1 && n >= 1) extraSixth[a] = Math.min(n, 200);
        });
      }

      if (urlExtraTags) {
        urlExtraTags.split(',').forEach(entry => {
          const [a, n] = entry.split(':').map(x => parseInt(x, 10));
          if (a >= 1 && n >= 1) extraTags[a] = Math.min(n, 500);
        });
      }

      if (urlExtraPacks) {
        urlExtraPacks.split(',').forEach(entry => {
          const [a, n] = entry.split(':').map(x => parseInt(x, 10));
          if (a >= 1 && n >= 1) extraPacks[a] = Math.min(n, 500);
        });
      }

      if (urlVouchers) {
        urlVouchers.split(',').forEach(entry => {
          const idx = entry.lastIndexOf(':');
          if (idx <= 0) return;
          const boughtAnte = parseInt(entry.slice(idx + 1), 10);
          if (!isNaN(boughtAnte) && boughtAnte >= 1) voucherPurchases[entry.slice(0, idx)] = boughtAnte;
        });
      }

      const clampCountField = (input, value) => {
        input.value = Math.max(0, Math.min(999, parseInt(value, 10) || 0));
      };
      GENERATORS.forEach(g => {
        const v = urlParams.get(g.param);
        if (v !== null) clampCountField(document.getElementById(g.input), v);
      });

      if (urlUnlocks) {
        // Decode the base64 string
        const binaryString = atob(urlUnlocks)
          .split('')
          .map(char => char.charCodeAt(0).toString(2).padStart(8, '0'))
          .join('');

        // Remove the padding byte (if present)
        const paddingLength = binaryString.length % 8;
        const unpadded = paddingLength > 0 ? binaryString.slice(0, -paddingLength) : binaryString;

        // Convert the binary string back to an array of booleans
        const decodedUnlocks = unpadded.split('').map(bit => bit === '1');
        selectedOptions = decodedUnlocks;
      }

      // Set default seed value
      if (urlAnte) {
        anteInput.value = urlAnte;
        anteInput.value = Math.min(anteInput.value, 999);
        anteInput.value = Math.max(anteInput.value, 1);
        framesPerAnteInput.value = defaultFrames(anteInput.value);
        var input = framesPerAnteInput.value.split(',').map(Number);
        var fixedInput = []
        for (let i = 0; i < anteInput.value; i++) {
          if (input.length < i) {
            fixedInput.push(0);
          } else {
            fixedInput.push(input[i]);
          }
          if (fixedInput[i] == undefined) fixedInput[i] = 0;
          if (isNaN(fixedInput[i])) fixedInput[i] = 0;
        }
        framesPerAnteInput.value = fixedInput;
      }
      if (urlFramesPerAnte) {
        framesPerAnteInput.value = urlFramesPerAnte;
        var input = framesPerAnteInput.value.split(',').map(Number);
        var fixedInput = []
        for (let i = 0; i < anteInput.value; i++) {
          if (input.length < i) {
            fixedInput.push(0);
          } else {
            fixedInput.push(input[i]);
          }
          if (fixedInput[i] == undefined) fixedInput[i] = 0;
          if (isNaN(fixedInput[i])) fixedInput[i] = 0;
        }
        framesPerAnteInput.value = fixedInput;
      }
      if (urlDeck) {
        deckInput.value = urlDeck;
      }
      if (urlStake) {
        stakeInput.value = urlStake;
      }
      if (urlSeed) {
        seedInput.value = filterSeed(urlSeed);
        instantAnalysis = true;
      }
      if (urlVersion) {
        versionInput.value = urlVersion;
      }

      // Add event listener for input event
      seedInput.addEventListener('input', () => {
        seedInput.value = filterSeed(seedInput.value);
      });
